name: CI

# Runs the test suite against a real Postgres service container - matches
# compose.yml's image/credentials exactly (user/password/event_ticketing)
# so the tests' default application.properties datasource config works
# unmodified, same as local `docker compose up -d` + `mvnw test`.
#
# This is deliberately separate from deploy.yml (which builds/pushes/
# deploys on push to main): deploy.yml's own Docker build runs with
# -DskipTests, so this workflow is currently the ONLY place tests actually
# run in CI.
#
# Runs ONLY when something is pushed to main (which includes the push a
# merged pull request creates) - not on feature branches or on pull requests.
# Run the suite locally before merging; this workflow then verifies main.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: event_ticketing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        # mvnw is committed without the executable bit (created on Windows,
        # git mode 100644), so a bare ./mvnw fails with exit code 126 on the
        # Linux runner. The Dockerfile does the same chmod.
        run: |
          chmod +x ./mvnw
          ./mvnw -B clean test

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
