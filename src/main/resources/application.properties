spring.application.name=event-ticketing-api
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/event_ticketing
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- Caching: public event list + detail (see common/config/CacheConfig) ---
# In-process Caffeine caches; writes clear them immediately, the TTL is the backstop.
app.cache.event.ttl-seconds=30
app.cache.event.max-size=1000
app.cache.event-search.ttl-seconds=30
app.cache.event-search.max-size=500
# Cap page size (Spring's default cap is 2000) so one request can't build or cache a huge page.
spring.data.web.pageable.max-page-size=100

# --- Logging (local/dev): log everything useful for development. ---
# SQL goes through the logger (not show-sql) so it carries the request id.
# application-prod.properties overrides all of this to near-silent JSON.
# Bound parameter values (org.hibernate.orm.jdbc.bind=TRACE) are enabled in
# application-dev.properties only, to keep test output manageable.
logging.level.com.junaldadlawan.event_ticketing_api=DEBUG
logging.level.org.hibernate.SQL=DEBUG
# (org.springframework.web is deliberately NOT set to DEBUG: it logs request
# and response body objects, i.e. passwords and tokens. RequestIdFilter's
# request line covers the same ground safely.)
# The dedicated audit-log logger (see common/logging/BusinessAuditLogger).
logging.level.AUDIT=INFO
app.logging.request-log.enabled=true
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{requestId:-}] [%X{userId:-}] %logger{30} - %msg%n
# Local log files (not in prod - see logback-spring.xml): one folder per day,
#   logs/<yyyy-MM-dd>/event-ticketing-api.<n>.log
# a new numbered file starts whenever one reaches max-size.
# The files are JSON (same format/fields as prod) while the console above stays
# readable text. logstash (default) or ecs.
app.logging.file.format=logstash
app.logging.file.dir=logs
app.logging.file.max-size=10MB
app.logging.file.max-history-days=14
app.logging.file.total-size-cap=500MB

spring.flyway.enabled=true

app.jwt.secret=dev-only-secret-change-me-before-any-real-deployment-0123456789
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000

# Dedicated secret for signing ticket credentials (Phase 6a) - deliberately
# separate from app.jwt.secret above (the credential is NOT a JWT).
app.ticket.credential.secret=dev-only-ticket-credential-secret-change-me-before-any-real-deployment

# Dedicated secret for signing ScannerDevice credentials (Phase 10) -
# deliberately its own secret, distinct from both app.jwt.secret and
# app.ticket.credential.secret.
app.device.credential.secret=dev-only-device-credential-secret-change-me-before-any-real-deployment

# How long a waitlisted user has to complete a purchase after being
# notified that a spot opened up (BR-WAIT-003), before it passes to the
# next person in line (Phase 11).
app.waitlist.offer-window-hours=24