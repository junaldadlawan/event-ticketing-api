spring.application.name=event-ticketing-api
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/event_ticketing
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.flyway.enabled=true

app.jwt.secret=dev-only-secret-change-me-before-any-real-deployment-0123456789
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000

# Dedicated secret for signing ticket credentials (Phase 6a) - deliberately
# separate from app.jwt.secret above (the credential is NOT a JWT).
app.ticket.credential.secret=dev-only-ticket-credential-secret-change-me-before-any-real-deployment

# Dedicated secret for signing ScannerDevice credentials (Phase 10) -
# deliberately its own secret, distinct from both app.jwt.secret and
# app.ticket.credential.secret.
app.device.credential.secret=dev-only-device-credential-secret-change-me-before-any-real-deployment

# How long a waitlisted user has to complete a purchase after being
# notified that a spot opened up (BR-WAIT-003), before it passes to the
# next person in line (Phase 11).
app.waitlist.offer-window-hours=24