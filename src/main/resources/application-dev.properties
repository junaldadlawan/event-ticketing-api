# Explicit mirror of application.properties' own defaults - optional to
# activate (-Dspring.profiles.active=dev / SPRING_PROFILES_ACTIVE=dev).
# `mvnw spring-boot:run` with NO profile flag already gets this exact
# config from the base file; this exists so "what dev means" is
# self-documenting as its own file, same shape as application-prod.properties,
# not just implicit in the base one.

spring.datasource.url=jdbc:postgresql://localhost:5432/event_ticketing
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Logging (dev): everything useful. Same as the base file, plus bound SQL
# parameter values so you can see exactly what each query was run with.
logging.level.com.junaldadlawan.event_ticketing_api=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
# Note: bound-parameter logging prints the actual values (including password
# hashes and token ids) - local use only. org.springframework.web is NOT set
# to DEBUG on purpose: it would log request/response bodies (plain passwords).
logging.level.AUDIT=INFO
app.logging.request-log.enabled=true
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{requestId:-}] [%X{userId:-}] %logger{30} - %msg%n
# Local log files, one folder per day: logs/<yyyy-MM-dd>/event-ticketing-api.<n>.log
app.logging.file.format=logstash
app.logging.file.dir=logs
app.logging.file.max-size=10MB
app.logging.file.max-history-days=14
app.logging.file.total-size-cap=500MB

app.jwt.secret=dev-only-secret-change-me-before-any-real-deployment-0123456789
app.ticket.credential.secret=dev-only-ticket-credential-secret-change-me-before-any-real-deployment
app.device.credential.secret=dev-only-device-credential-secret-change-me-before-any-real-deployment
