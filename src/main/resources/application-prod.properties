# Activated in production via SPRING_PROFILES_ACTIVE=prod, set on the ECS
# task definition (deploy/aws/terraform/ecs.tf). Every value below is
# read from an environment variable that same task definition already
# injects - four of them (the DB password + all three app secrets) come
# from AWS Secrets Manager via the task's `secrets` block, never baked
# into the image or logged. No default fallback on any of these six - a
# missing one fails startup with a clear "could not resolve placeholder"
# error instead of silently booting with a blank/dev value in production.

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway (already enabled in the base file) is the only thing that should
# ever change the prod schema - validate confirms the schema matches
# Flyway's own migration history instead of letting Hibernate auto-alter
# it. Defaults to validate even if this env var were ever dropped from
# the task def - deliberately never falls back to dev's `update`.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false

app.jwt.secret=${APP_JWT_SECRET}
app.ticket.credential.secret=${APP_TICKET_CREDENTIAL_SECRET}
app.device.credential.secret=${APP_DEVICE_CREDENTIAL_SECRET}
