# Activated in production via SPRING_PROFILES_ACTIVE=prod, set on the ECS
# task definition (deploy/aws/terraform/ecs.tf). Every value below is
# read from an environment variable that same task definition already
# injects - four of them (the DB password + all three app secrets) come
# from AWS Secrets Manager via the task's `secrets` block, never baked
# into the image or logged. No default fallback on any of these six - a
# missing one fails startup with a clear "could not resolve placeholder"
# error instead of silently booting with a blank/dev value in production.

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway (already enabled in the base file) is the only thing that should
# ever change the prod schema - validate confirms the schema matches
# Flyway's own migration history instead of letting Hibernate auto-alter
# it. Defaults to validate even if this env var were ever dropped from
# the task def - deliberately never falls back to dev's `update`.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false

# --- Logging (prod): only important business transactions + real problems. ---
# stdout ONLY: no log files in prod (logback-spring.xml adds the rolling file
# appender for every profile except prod) - the container's files vanish on
# restart, and the ECS awslogs driver already ships stdout to CloudWatch.
# One JSON object per line on stdout; the ECS awslogs driver ships it to
# CloudWatch Logs, where Logs Insights reads the fields directly (every MDC
# field - requestId, userId, and for audit lines log_type/action/actorId/
# targetType/targetId/outcome - is a top-level JSON field). Query examples:
# docs/event-ticketing-api-logging.md.
logging.structured.format.console=logstash
logging.level.root=WARN
logging.level.com.junaldadlawan.event_ticketing_api=WARN
# application.properties (shared with dev) sets some more specific loggers to
# DEBUG/TRACE, and a specific logger beats root - so each must be reset here
# explicitly. ProdLoggingConfigurationTest fails if any logging.level is
# noisier than WARN apart from the allow-listed ones below.
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.springframework.web=WARN
# Spring Boot generates and prints a throw-away password for a default
# in-memory user. This app authenticates with JWTs only so that account is
# unusable, but a credential-looking line does not belong in CloudWatch.
logging.level.org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration=ERROR
# Audit log: every important business transaction (BusinessAuditLogger).
logging.level.AUDIT=INFO
# Keep the one-line startup confirmation and the Flyway migration summary.
logging.level.com.junaldadlawan.event_ticketing_api.EventTicketingApiApplication=INFO
logging.level.org.flywaydb.core.internal.command.DbMigrate=INFO
# No per-request chatter in prod.
app.logging.request-log.enabled=false

app.jwt.secret=${APP_JWT_SECRET}
app.ticket.credential.secret=${APP_TICKET_CREDENTIAL_SECRET}
app.device.credential.secret=${APP_DEVICE_CREDENTIAL_SECRET}
