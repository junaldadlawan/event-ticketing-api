openapi: 3.1.0
info:
  title: Event Ticketing API
  version: "1.3.0-draft"
  description: >
    Full v1 marketplace surface for a multi-organizer event ticketing
    platform: identity/auth, organization onboarding (application +
    admin approval) and org-scoped roles, events & ticket types, cart &
    checkout (with promo codes), orders & tickets, ticket transfer &
    organizer-controlled resale, waitlists, refunds & payouts, ticket
    templates, check-in/scanning, notifications, disputes, admin
    moderation actions, audit log, and analytics. Aligned to requirements.md v1.0, business-rules.md v1.0,
    and use-cases.md v1.0. Genuinely open/undecided items (target
    markets, resale opt-in/out default, mid-event check-in mode
    switching, etc.) are tracked in requirements.md section 7, not
    modeled here.
servers:
  - url: https://api.example.com/v1
    description: Placeholder — actual host TBD in the architecture phase.

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Organizations
  - name: Venues
  - name: Categories
  - name: Posts
  - name: PlatformFees
  - name: Uploads
  - name: Events
  - name: TicketTypes
  - name: SeatMaps
  - name: PromoCodes
  - name: Waitlist
  - name: Cart
  - name: Orders
  - name: Tickets
  - name: Resale
  - name: TicketTemplates
  - name: Refunds
  - name: Payouts
  - name: Payment methods
  - name: CheckIn
  - name: Notifications
  - name: Disputes
  - name: Moderation
  - name: Audit
  - name: Analytics

paths:
  /auth/register:
    post:
      operationId: registerUser
      tags: [Auth]
      security: []
      summary: Create a User account (always a CUSTOMER)
      description: |
        Every new account is a CUSTOMER; a `role` (or any other extra property) in the body is ignored.
        The name comes as `firstName` and `lastName` (both required) and an optional `middleName`; each may only contain
        letters (any language), spaces, `.`, apostrophes and `-`, and must start with a letter. There is no single `name` field.
        `birthDate` is required (ISO `yyyy-MM-dd`, before today and not more than 120 years ago). `phoneNumber` is optional
        and, when given, must be international format: `+` then 8 to 15 digits (no spaces, dashes or brackets); empty or
        omitted means none.
        `email` must be plain ASCII: letters, digits and `. _ % + -` before the @ (starting and ending with a letter or
        digit, never doubled), then a real domain. Anything else is a 400. The same rules apply when the name or email is
        changed through `PATCH /users/me`. The password may contain any character.
        Note: on the wire the password field is named `passwordHash` (the plain password; it is hashed before saving).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, birthDate, email, passwordHash]
              properties:
                firstName:
                  type: string
                  maxLength: 150
                  pattern: "^\\p{L}[\\p{L}\\p{M} .'\\u2019-]*$"
                middleName:
                  type: [string, "null"]
                  maxLength: 150
                  description: Optional; empty or omitted means none.
                  pattern: "^(\\p{L}[\\p{L}\\p{M} .'\\u2019-]*)?$"
                lastName:
                  type: string
                  maxLength: 150
                  pattern: "^\\p{L}[\\p{L}\\p{M} .'\\u2019-]*$"
                birthDate: { type: string, format: date, description: "Before today, at most 120 years ago." }
                phoneNumber:
                  type: [string, "null"]
                  maxLength: 20
                  pattern: "^(\\+[1-9][0-9]{7,14})?$"
                  description: Optional. International format, + then 8 to 15 digits.
                email:
                  type: string
                  maxLength: 255
                  pattern: "^[A-Za-z0-9]+([._%+-][A-Za-z0-9]+)*@([A-Za-z0-9]+(-[A-Za-z0-9]+)*\\.)+[A-Za-z]{2,}$"
                passwordHash: { type: string, description: The plain password (hashed before saving). }
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { description: "An account with this email already exists (compared ignoring case; a deleted account still holds its email)." }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      security: []
      summary: Exchange credentials for tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [Auth]
      security: []
      summary: Exchange a refresh token for a new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: New access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  expires_in: { type: integer, description: seconds }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users/me:
    get:
      operationId: getCurrentUser
      tags: [Auth]
      summary: The caller's own account, with org memberships and roles
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
    patch:
      operationId: updateCurrentUser
      tags: [Auth]
      summary: Update the caller's own profile (first / middle / last name, email, profile picture)
      description: |
        Every field is optional; one that is left out is not changed. `avatarUrl` must be the URL returned by
        `POST /uploads` on this server; any other link is a 400. Send an empty string to remove the picture.
        The file of a replaced or removed picture is deleted from storage unless something else (another user,
        a ticket template, an event image) still uses it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName: { type: string, maxLength: 150, description: Same character rules as at registration; omit to leave unchanged. }
                middleName: { type: string, maxLength: 150, description: Same rules; "" removes the middle name; omit to leave unchanged. }
                lastName: { type: string, maxLength: 150, description: Same character rules as at registration; omit to leave unchanged. }
                birthDate: { type: string, format: date, description: Same rule as at registration; omit to leave unchanged. }
                phoneNumber: { type: string, maxLength: 20, description: "Same rule as at registration; \"\" removes the phone number; omit to leave unchanged." }
                email: { type: string, format: email }
                avatarUrl:
                  type: string
                  maxLength: 500
                  description: URL of an image uploaded through `POST /uploads`; "" removes the profile picture; omit to leave it unchanged.
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Another account already uses that email. }

  /users/me/orders:
    get:
      operationId: listMyOrders
      tags: [Orders]
      summary: Orders placed by the caller
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderList" }

  /users/me/waitlist-entries:
    get:
      operationId: listMyWaitlistEntries
      tags: [Waitlist]
      summary: Waitlist entries the caller has joined
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WaitlistEntry" }

  /users/me/payment-methods:
    get:
      operationId: listMyPaymentMethods
      tags: [Payment methods]
      summary: The caller's saved cards, primary first
      description: Any signed-in user, for their own cards only. Never includes the provider's id or a token.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PaymentMethod" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: addMyPaymentMethod
      tags: [Payment methods]
      summary: Save a card
      description: |
        With the Stripe gateway `paymentToken` is a Stripe `pm_...` id: the card is attached to the caller's Stripe Customer
        (created on first use) and its brand, last 4 and expiry are read from Stripe (anything sent for them is ignored). With the
        default mock gateway `paymentToken` is `tok_<brand>` and the details come from the body; `tok_fail...` is refused.
        The first card is always primary; `primary: true` unsets the previous primary in the same transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentMethodRequest" }
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentMethod" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: That Stripe card is already saved }
        "502": { description: The payment provider is unavailable }

  /users/me/payment-methods/setup-intent:
    post:
      operationId: createMyPaymentMethodSetupIntent
      tags: [Payment methods]
      summary: Start saving a card (Stripe SetupIntent)
      description: Creates a SetupIntent (usage off_session) for the caller's Stripe Customer, creating the customer on first use. With the mock gateway it returns the dummy secret `seti_mock_secret` and calls nothing.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  clientSecret: { type: string, description: Pass to Stripe.js. A secret for this one setup; do not log it. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users/me/payment-methods/{id}/primary:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: setMyPrimaryPaymentMethod
      tags: [Payment methods]
      summary: Make this card the primary one
      description: The previous primary is unset in the same transaction. Another user's card id is a 404.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentMethod" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/me/payment-methods/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: removeMyPaymentMethod
      tags: [Payment methods]
      summary: Remove a saved card (soft delete, detached from Stripe)
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: It is the primary card and other cards exist; make another card primary first }

  /users/me/notifications:
    get:
      operationId: listMyNotifications
      tags: [Notifications]
      summary: Notifications triggered for the caller, and their delivery status
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notification" }

  /organizations:
    get:
      operationId: listOrganizations
      tags: [Organizations]
      summary: List organization applications (admin only — the review queue)
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected] }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Organization" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: applyToCreateOrganization
      tags: [Organizations]
      summary: >
        Submit an application to create an Organization. The caller does
        NOT become owner on submission — only on admin approval
        (see POST /organizations/{orgId}/approve).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationCreate" }
      responses:
        "201":
          description: Application submitted, status pending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /organizations/mine:
    get:
      operationId: listMyOrganizations
      tags: [Organizations]
      summary: The caller's own organizations, of every status
      description: |
        Every non-deleted organization the caller is a member of (owner, organizer or check-in staff) or applied
        for, whatever its status (PENDING, APPROVED, REJECTED, SUSPENDED), oldest first. A pending or rejected
        application has no members yet, so it is matched by its applicant. An empty list when there are none.
        Never returns an organization the caller has no relation to - not even for an admin (use
        `GET /organizations` for the review queue).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Organization" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /organizations/{orgId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: getOrganization
      tags: [Organizations]
      summary: Get an Organization (the applicant, its members, or admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateOrganization
      tags: [Organizations]
      summary: Update an Organization (owner or organizer only; approved orgs only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }

  /organizations/{orgId}/approve:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    post:
      operationId: approveOrganization
      tags: [Organizations]
      summary: >
        Approve a pending organization application (admin only). Sets
        status to approved, sets owner_id to the applicant, and grants
        the applicant the owner role via OrganizationMember.
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Application is not in pending status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /organizations/{orgId}/reject:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    post:
      operationId: rejectOrganization
      tags: [Organizations]
      summary: Reject a pending organization application (admin only)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "200":
          description: Rejected — applicant gains no organization privileges
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Application is not in pending status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /organizations/{orgId}/members:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listOrganizationMembers
      tags: [Organizations]
      summary: List an organization's members and their roles (members or admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrganizationMember" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: assignOrganizationRole
      tags: [Organizations]
      summary: >
        Assign a role (organizer or check_in_staff) to a user within this
        organization. Roles are additive/combinable, not exclusive. Two
        cases: assigning a *different* user requires the caller to be the
        organization's owner; a caller may always assign an additional
        role to *themselves* if they already hold at least one role
        (owner or organizer) in this organization — no separate approval
        needed for self-assignment. The owner role itself can never be
        granted here — it's only ever set by organization-application
        approval.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationMemberAssign" }
      responses:
        "201":
          description: Role assigned (membership created or updated)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationMember" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /analytics/platform/finance:
    get:
      operationId: getPlatformFinanceSummary
      tags: [Analytics]
      summary: The platform's money for a period - sales, income, gateway fees, organizers' share, payouts (admin only)
      description: |
        Computed live from orders, refunds and payouts (no balance table). Counts the orders **placed** in the period (PAID, PARTIALLY_REFUNDED or
        REFUNDED) with their completed refunds. `platform.netIncome` = the platform fee kept (none when the platform bore it, none on a refunded
        order) minus the gateway cost the platform bears (the fee when it is the payer, the extra a foreign card cost over what the customer was
        charged, and the whole fee of a fully refunded order). `organizers.share` is what the organizations are owed, the same net their payouts
        pay, split into `paidOut`, `inPayouts` and `owedNotYetInPayout`. `payouts` counts the payouts created in the period by status.
        Simplifications: a partial refund does not reduce the gateway cost; refunds count against the period the order was placed in.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date }, description: "First UTC day (default: 30 days up to `to`)." }
        - { name: to, in: query, schema: { type: string, format: date }, description: "Last UTC day, included (default: today). The period is at most 366 days." }
        - { name: currency, in: query, schema: { type: string, default: PHP }, description: "Three-letter code; orders in other currencies are left out and listed in `otherCurrencies`." }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceSummary" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /organizations/{orgId}/finance:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: getOrganizationFinanceSummary
      tags: [Analytics]
      summary: An organization's own income for a period (its owner or an admin)
      description: |
        The same period rules and per-order calculation as the platform summary, for this organization only, and never the platform's figures.
        `sales.gross` is what buyers paid (fees added on top included); `deductions` is everything between that and `income` (the platform fee and the
        gateway fee that came or will come off, including fees customers paid on top); `income` = gross - refunds - deductions, exactly the net its
        payouts pay. It is split into `paidOut` (PAID payouts), `inPayouts` (scheduled, processing or failed ones) and `owedNotYetInPayout`.
        Only the organization's owner or an admin: an organizer or member, or another organization's owner, gets 403.
        With `eventId`, every figure covers only that event: its orders (an order belongs to the event its tickets are for) and its payouts.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date }, description: "First UTC day (default: 30 days up to `to`)." }
        - { name: to, in: query, schema: { type: string, format: date }, description: "Last UTC day, included (default: today). The period is at most 366 days." }
        - { name: currency, in: query, schema: { type: string, default: PHP }, description: "Three-letter code; orders in other currencies are left out and listed in `otherCurrencies`." }
        - $ref: "#/components/parameters/FinanceEventId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationFinance" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /organizations/{orgId}/finance/earnings:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: getOrganizationEarnings
      tags: [Analytics]
      summary: An organization's income per day or month (its owner or an admin)
      description: |
        `earnings` is the same figure as `income` in the finance summary (net sales minus the platform and gateway fees that come off), grouped by
        the UTC day or month the order was placed. Every period of the range is present, with 0 when there was none. The same access, period
        (at most 366 days), currency and `eventId` rules as `GET /organizations/{orgId}/finance`.
      parameters:
        - { name: interval, in: query, schema: { type: string, enum: [DAY, MONTH], default: DAY }, description: "DAY labels periods `2026-10-15`, MONTH `2026-10`." }
        - { name: from, in: query, schema: { type: string, format: date }, description: "First UTC day (default: 30 days up to `to`)." }
        - { name: to, in: query, schema: { type: string, format: date }, description: "Last UTC day, included (default: today). The period is at most 366 days." }
        - { name: currency, in: query, schema: { type: string, default: PHP }, description: "Three-letter code; orders in other currencies are left out." }
        - $ref: "#/components/parameters/FinanceEventId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationEarnings" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /organizations/{orgId}/transactions:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listOrganizationTransactions
      tags: [Analytics]
      summary: An organization's money lines - sales, refunds and payouts, newest first (its owner or an admin)
      description: |
        One line per order placed in the period (SALE: `gross` what the buyer paid, `fees` the platform and gateway fees that come off, `net` the
        rest), per completed refund issued in the period (REFUND: `net` is minus the amount; a refund line carries no fees) and per payout created
        in the period (PAYOUT: its gross, fees and net, `net` negative as the money leaves). Lines in every currency are listed, each with its own.
        `orderId` is null for a payout. The same access, period and `eventId` rules as `GET /organizations/{orgId}/finance`.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date }, description: "First UTC day (default: 30 days up to `to`)." }
        - { name: to, in: query, schema: { type: string, format: date }, description: "Last UTC day, included (default: today). The period is at most 366 days." }
        - $ref: "#/components/parameters/FinanceEventId"
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionPage" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /organizations/{orgId}/payouts:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listOrganizationPayouts
      tags: [Payouts]
      summary: >
        List an organization's payouts (owner/organizer or admin).
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Payout" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: generateOrganizationPayout
      tags: [Payouts]
      summary: Generate a payout for a period (admin only) - this is where the platform fees are deducted
      description: |
        Settles every order of the organization that is paid (or partly refunded), placed in the period (UTC, both
        days included) and not yet in a payout. Per order: `gross` = what the buyer paid minus refunds; `fees` = the
        platform fee that order was charged (never more than the gross left after refunds); `net` = gross - fees,
        which is what the organizer is owed. Fully refunded orders are left out. The payout is created SCHEDULED and
        its orders are marked as settled, so no order is ever paid out twice.
        409 when the organization has no primary payout card, when no order is due in the period, or when the orders
        use more than one currency. The payout is made out to the primary card and records its id (`payoutCardId`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayoutGenerate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payout" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        409: { description: The organization has no primary payout card (no payout account when PayMongo is the gateway); or no orders are due for payout in that period; or they use more than one currency }

  /organizations/{orgId}/payout-account:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: getOrganizationPayoutAccount
      tags: [Payouts]
      summary: The bank or e-wallet account the organization is paid out to (owner, organizer or admin)
      description: Only the last 4 digits of the account number are returned.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayoutAccount" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: setOrganizationPayoutAccount
      tags: [Payouts]
      summary: Set or replace the payout account (owner or admin)
      description: |
        PayMongo pays organizers into a bank or e-wallet account, not a card. Pick the bank from `GET /payout-banks` and send its `code` as
        `bankCode`. `accountName` must match the name the bank has on the account. The full number is stored AES-256-GCM encrypted and is
        never returned or logged; 503 when the server has no encryption key (`PAYOUT_ENCRYPTION_KEY`). The organization must be approved.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayoutAccountRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayoutAccount" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: removeOrganizationPayoutAccount
      tags: [Payouts]
      summary: Remove the payout account (owner or admin)
      responses:
        "204": { description: No Content }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /payout-banks:
    get:
      operationId: listPayoutBanks
      tags: [Payouts]
      summary: The banks and e-wallets a payout can be sent to
      description: From PayMongo (InstaPay receivers) when it is the gateway; a single test bank otherwise.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    code: { type: string, description: What `bankCode` takes. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { description: PayMongo is unavailable }

  /payment-gateway-fee/check:
    get:
      operationId: checkPaymentGatewayFee
      tags: [PlatformFees]
      summary: Compare the fee setting with what the payment gateway really charged (admin only)
      description: |
        PayMongo publishes no endpoint for its fee rates, so this reads its latest paid payments (each carries the `fee`, the `foreign_fee`
        surcharge for a card issued abroad and the `net_amount`) and shows them next to the setting. Each sample is recognised as
        **DOMESTIC_CARD** (3.5% + PHP 15.00, VAT included) or **INTERNATIONAL_CARD** (4.5% + PHP 15.00: the same plus a 1% foreign-card
        surcharge), or null when neither fits within a centavo. `suggestedSetting` is the rate of the newest recognised payment, ready to send
        to PUT /payment-gateway-fee. The setting is applied to the amount before the fee while PayMongo takes its fee from the amount charged,
        so a customer-paid fee can differ by a few centavos. Outside PayMongo mode `provider` is MOCK and there are no samples.
        400 for a limit outside 1-20; 502 when PayMongo cannot be read.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 5 }
          description: How many of the latest paid payments to read.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GatewayFeeCheck" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { description: PayMongo is unavailable }

  /payout-wallet:
    get:
      operationId: getPayoutWallet
      tags: [Payouts]
      summary: The wallet organizers are paid from - status, balance, limits, usage and account (admin only)
      description: |
        Shows what PayMongo reports for the platform's wallet, so an admin can see whether a payout can be sent: only an `activated` wallet can
        send, and `balance.available` has to cover the payout plus PayMongo's transfer fee. `balance.pending` is still in transit (card payments
        settle into the wallet on PayMongo's payout cycle). A limit of 999999999999999999 means PayMongo sets none. `matchesConfiguredAccount`
        says whether this is the wallet named in `PAYMONGO_WALLET_ACCOUNT_NUMBER` (null when nothing is configured to compare). Outside PayMongo
        mode a simulated wallet is shown with `provider` MOCK. 404 when the PayMongo account has no wallet yet (activate one in the Dashboard);
        502 when PayMongo cannot be reached.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayoutWallet" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { description: PayMongo is unavailable }

  /payouts/eligible:
    get:
      operationId: listEligiblePayouts
      tags: [Payouts]
      summary: What can be paid out now, per organization and event (admin only)
      description: |
        One line per approved organization and event with orders that are due: paid or partly refunded, in no payout yet, placed in the UTC days
        `periodStart`..`periodEnd` (both included, not in the future, at most 366 days). `eligible` is the net a payout of the line would pay
        (gross after refunds minus the platform fee and the gateway fee that come off the organization). A line is **ON_HOLD** when any of its
        orders has a refund still pending (`holdReason` "Pending refunds") or its orders use more than one currency ("More than one currency").
        `eventScope` COMPLETED (default) keeps events that are over (status COMPLETED, or ended and not cancelled, suspended or a draft); ALL keeps
        every event. The summary counts the organizations with a READY line and adds up the READY and the ON_HOLD amounts (in the currency of the first line).
      parameters:
        - { name: periodStart, in: query, required: true, schema: { type: string, format: date } }
        - { name: periodEnd, in: query, required: true, schema: { type: string, format: date } }
        - { name: organizationId, in: query, schema: { type: string, format: uuid }, description: Only this organization. }
        - { name: eventScope, in: query, schema: { type: string, enum: [COMPLETED, ALL], default: COMPLETED } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EligiblePayouts" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /payouts/batch:
    post:
      operationId: generatePayoutBatch
      tags: [Payouts]
      summary: Generate one payout per chosen line (admin only)
      description: |
        Each line (an organization and one of its events) becomes its own SCHEDULED payout settling that event's due orders of the period
        (`eventId` and `eventTitle` are on the payout). All or nothing: if any line has nothing due, is on hold (a refund is still pending), mixes
        currencies, or its organization is not approved or has no payout destination (a primary card; a payout account with PayMongo), nothing is
        created and the 409 names the line. 400 for an empty or duplicated list or a bad period; 404 for an unknown organization or an event that is
        not the organization's. A line already settled is never paid twice (409).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayoutBatchRequest" }
      responses:
        "201":
          description: The payouts created, in the order of the lines.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Payout" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "A line has nothing due, is on hold, mixes currencies, or has no payout destination; nothing was created" }

  /payouts/{payoutId}/send:
    parameters:
      - name: payoutId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: sendPayout
      tags: [Payouts]
      summary: Send a payout to the organization's payout account (admin only)
      description: |
        Sends the `net` amount of a SCHEDULED or FAILED payout through the payment provider. The payout becomes PROCESSING and ends PAID or
        FAILED when PayMongo reports it (the `transfer.outward.successful` / `transfer.outward.failed` webhook, or `POST /payouts/{id}/refresh`);
        an InstaPay transfer can take up to 20 minutes, PESONet up to a banking day. Amounts up to PHP 50,000 go by InstaPay, larger by PESONet.
        PayMongo charges the wallet a fee per transfer, which the platform bears. A FAILED payout carries `failureReason` and can be sent again;
        when the reason says the transfer could not be confirmed, check the PayMongo dashboard first, because the money may have moved.
        Outside PayMongo mode the transfer is only simulated: the payout becomes PAID at once and no money moves.
        409 when the payout is PROCESSING, PAID or CANCELLED, has nothing to send, or the organization has no payout account. 502 when PayMongo cannot be reached.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payout" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The payout cannot be sent in its current state }
        "502": { description: PayMongo is unavailable; the transfer could not be confirmed }

  /payouts/{payoutId}/refresh:
    parameters:
      - name: payoutId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: refreshPayout
      tags: [Payouts]
      summary: Ask the provider how a PROCESSING payout's transfer stands (admin only)
      description: Use it when the webhook did not arrive. 409 when the payout is not PROCESSING (a CANCELLED one included).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payout" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The payout is not being processed }

  /payouts/{payoutId}/cancel:
    parameters:
      - name: payoutId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: cancelPayout
      tags: [Payouts]
      summary: Cancel a SCHEDULED payout and release its orders (admin only)
      description: |
        In one transaction the payout becomes CANCELLED and every order in it is released, so those orders are owed again, are listed by
        `GET /payouts/eligible` and can be settled by a new payout. A cancelled payout is final: it cannot be sent, refreshed or cancelled again,
        and it counts nowhere in the finance figures. Only a SCHEDULED payout can be cancelled: a PROCESSING (with PayMongo), PAID, FAILED or
        CANCELLED one gets 409, and so does a cancel that loses the race to a concurrent send. Anyone but an admin, the organization's own owner and
        organizers included, gets 403. Audit-logged as `payout.cancelled`.
      responses:
        "200":
          description: The cancelled payout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payout" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Only a scheduled payout can be cancelled" }

  /organizations/{orgId}/payout-cards:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listOrganizationPayoutCards
      tags: [Payouts]
      summary: List the organization's payout cards (owner, organizer or admin)
      description: Oldest first. The gateway token is never returned.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PayoutCard" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: addOrganizationPayoutCard
      tags: [Payouts]
      summary: Add a payout card (owner or admin; the organization must be approved)
      description: |
        Stores what the payment gateway returned for the card: token, brand, last 4, expiry and holder name. The full
        card number and the security code are never accepted or stored. The organization's first card is always primary;
        a later card is primary only when `primary` is true, which unsets the previous primary in the same transaction.
        With the mock payout gateway (`payments.payout-gateway=mock`, the default) the details sent are ignored and one fixed demo
        card (Visa, last 4 `4242`, expiry 12/2099) is saved.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayoutCardRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayoutCard" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not the owner or an admin; or the organization is not approved }
        "404": { $ref: "#/components/responses/NotFound" }

  /payout-cards/{cardId}/primary:
    parameters:
      - name: cardId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: setPrimaryPayoutCard
      tags: [Payouts]
      summary: Make this card the organization's primary payout card (owner or admin)
      description: The previous primary card is unset in the same transaction, so there is always exactly one.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayoutCard" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /payout-cards/{cardId}:
    parameters:
      - name: cardId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: removePayoutCard
      tags: [Payouts]
      summary: Remove a payout card (owner or admin; soft delete)
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: This is the primary card and the organization has other cards; make another card primary first }

  /organizations/{orgId}/venues:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listOrganizationVenues
      tags: [Venues]
      summary: List an organization's venues (members or admin only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Venue" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createVenue
      tags: [Venues]
      summary: Add a reusable Venue to the organization (owner or organizer only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VenueCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Venue" }

  /uploads:
    post:
      operationId: uploadImage
      tags: [Uploads]
      summary: Upload an image (any signed-in user) - e.g. a ticket template background
      description: PNG, JPEG, WebP or GIF, up to 5 MB. The type is detected from the file's own bytes (SVG and anything else is rejected); the stored name is random.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                folder:
                  type: string
                  enum: [events, organizations, platform, temporary, tickets, users]
                  default: temporary
                  description: "What the image is for, which decides where it is stored: events (event images), organizations (organization documents), platform (posts), tickets (ticket template backgrounds and logos), users (profile pictures). Omitted = temporary."
      responses:
        "201":
          description: Stored. The returned URL is `/uploads/files/{folder}/{name}` on this server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadedImage" }
        "400": { description: "Not a PNG/JPEG/WebP/GIF image, no file part, or an unknown folder" }
        "413": { description: Larger than 5 MB }

  /uploads/files/{folder}/{name}:
    get:
      operationId: getUploadedImageInFolder
      tags: [Uploads]
      security: []
      summary: Serve an uploaded image (public), from local disk or the private R2 bucket
      parameters:
        - name: folder
          in: path
          required: true
          schema: { type: string, enum: [events, organizations, platform, temporary, tickets, users] }
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The image
          content:
            image/*:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }

  /uploads/files/{name}:
    get:
      operationId: getUploadedImage
      tags: [Uploads]
      security: []
      summary: Serve an uploaded image (public) stored before uploads had folders
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The image
          content:
            image/*:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }

  /platform-fees:
    get:
      operationId: listPlatformFeeRules
      tags: [PlatformFees]
      summary: List the platform fee rules (admin only)
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [PLATFORM, ORGANIZATION, EVENT] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PlatformFeeRule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /platform-fees/effective:
    get:
      operationId: getEffectivePlatformFee
      tags: [PlatformFees]
      summary: Which rule applies to an event right now (admin only)
      parameters:
        - name: eventId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK - `rule` is null when no rule applies (no fee is charged)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EffectivePlatformFee" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /payment-gateway-fee:
    get:
      operationId: getPaymentGatewayFee
      tags: [PlatformFees]
      summary: The payment gateway fee setting (admin only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GatewayFeeSetting" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: setPaymentGatewayFee
      tags: [PlatformFees]
      summary: Set how much payment gateway fee to apply and who pays it (admin only)
      description: |
        One platform-wide setting with the gateway's two numbers, for example PayMongo's card rate 3.125% + PHP 13.39 is
        `{"percentage": 3.125, "flatAmount": {"amount": 1339, "currency": "PHP"}}`. That is the **domestic** rate: a card issued abroad costs more with
        PayMongo, so `foreignPercentage` / `foreignFlatAmount` set the whole rate for such cards (PayMongo: 3.5% + PHP 15.00 domestic, 4.5% + PHP 15.00
        foreign); leave both out and a foreign card costs the domestic rate. The customer pays the domestic rate in the cart (the card is not known yet);
        when the payment arrives and its card was issued outside the Philippines, the order records the foreign fee that applied and the payout
        deducts it when the organization bears the fee (when the customer bears it the organizer keeps the ticket price and the platform absorbs the
        difference). The fee is `(ticket total after promo + platform fee) x percentage`, rounded half up, plus the flat amount
        when the order is in its currency. `payer` decides who bears it: **CUSTOMER** (added to the price, shown in the cart as `gatewayFee`,
        and taken off the gross at payout so the organizer keeps the ticket price), **ORGANIZATION** (deducted from the organizer's payout, the
        buyer pays nothing extra). The platform cannot be the payer: PLATFORM is refused with 400. 0% with no flat amount switches it off. Orders already placed keep their own snapshot.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GatewayFeeSettingRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GatewayFeeSetting" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /platform-fees/default:
    put:
      operationId: setDefaultPlatformFee
      tags: [PlatformFees]
      summary: Set (or replace) the platform-wide default fee (admin only)
      description: |
        The fee ("admin cut") added on top of the ticket price of every purchase that has no more specific rule.
        A percentage is worked out on the ticket total after promo discounts; a flat amount is charged for every ticket
        (fee = ticket total x percentage + flat amount x number of tickets).
        A rate of 0 is allowed and means no fee.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformFeeRuleRequest" }
      responses:
        "200":
          description: The rule now in force
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformFeeRule" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: removeDefaultPlatformFee
      tags: [PlatformFees]
      summary: Remove the platform-wide default (admin only) - purchases without an override then pay no fee
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /platform-fees/organizations/{organizationId}:
    parameters:
      - name: organizationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: setOrganizationPlatformFee
      tags: [PlatformFees]
      summary: Override the fee for one organization (admin only) - applies to its events that have no event rule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformFeeRuleRequest" }
      responses:
        "200":
          description: The rule now in force
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformFeeRule" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: removeOrganizationPlatformFee
      tags: [PlatformFees]
      summary: Remove an organization's override (admin only) - the platform default applies again
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /platform-fees/events/{eventId}:
    parameters:
      - name: eventId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: setEventPlatformFee
      tags: [PlatformFees]
      summary: Override the fee for one event (admin only) - the most specific rule, it beats the organization and the default
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformFeeRuleRequest" }
      responses:
        "200":
          description: The rule now in force
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformFeeRule" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: removeEventPlatformFee
      tags: [PlatformFees]
      summary: Remove an event's override (admin only) - the organization's rule, else the default, applies again
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /posts:
    get:
      operationId: listPosts
      tags: [Posts]
      security: []
      summary: List sales and announcements (public), newest first
      description: |
        With no filter: site-wide posts plus the posts of events that are published (published, on sale, sold out
        or completed). Posts of draft, cancelled, suspended or deleted events are never listed.
        Only **live** posts are listed: not hidden, already published (`publishAt` reached or none) and not yet
        expired (`expiresAt` not reached or none). Newest first by the moment a post went live (its `publishAt`,
        else when it was created). `eventId` and `siteWide=true` cannot be combined (400).
        An admin may add `all=true` to see every post that is not deleted - hidden, scheduled and expired ones
        included, and those of non-public events - each with its `status`; anyone else gets a 403 for it.
      parameters:
        - name: eventId
          in: query
          description: Only the posts of this event (nothing if the event is not public).
          schema: { type: string, format: uuid }
        - name: siteWide
          in: query
          description: Only the posts that belong to no event.
          schema: { type: boolean, default: false }
        - name: all
          in: query
          description: Admin only. Include hidden, scheduled and expired posts and those of non-public events.
          schema: { type: boolean, default: false }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          description: Page size; larger values are capped at 50.
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: A page of posts (always newest first)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostPage" }
        "400": { $ref: "#/components/responses/ValidationError" }
    post:
      operationId: createPost
      tags: [Posts]
      summary: Publish a sale or an announcement (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /posts/{postId}:
    parameters:
      - name: postId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updatePost
      tags: [Posts]
      summary: Edit, schedule, expire, hide or unhide a post (admin only)
      description: |
        Every field is optional; one that is left out (or null) is not changed. The event of a post cannot be
        changed. Use `clearPublishAt` / `clearExpiresAt` to remove a date. The resulting `expiresAt` must be after
        the resulting `publishAt` (400); an `expiresAt` in the past is allowed here - it ends the post right now.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deletePost
      tags: [Posts]
      summary: Remove a post (admin only). Soft delete - it is no longer listed, and its picture file is deleted unless something else still uses it.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /categories:
    get:
      operationId: listCategories
      tags: [Categories]
      security: []
      summary: List active event categories (public) - the allowed values for an event's category
      responses:
        "200":
          description: OK (ordered by sort_order, then name)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }
    post:
      operationId: createCategory
      tags: [Categories]
      summary: Create a category (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: A category with that name (or slug) already exists }

  /categories/{categoryId}:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getCategory
      tags: [Categories]
      security: []
      summary: Get a category (public; also returns inactive ones)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateCategory
      tags: [Categories]
      summary: Update a category, including re-activating it (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: A category with that name (or slug) already exists }
    delete:
      operationId: deactivateCategory
      tags: [Categories]
      summary: Deactivate a category (admin only). Soft - hidden from the list and refused for new events; existing events keep it.
      responses:
        "204": { description: Deactivated }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /venues/{venueId}:
    parameters:
      - $ref: "#/components/parameters/VenueId"
    get:
      operationId: getVenue
      tags: [Venues]
      security: []
      summary: Get a Venue (public — needed to render event location/address for buyers)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Venue" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateVenue
      tags: [Venues]
      summary: Update a Venue (owning organization's owner or organizer only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VenueUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Venue" }

  /events:
    get:
      operationId: listEvents
      tags: [Events]
      security: []
      summary: Search/list published events (public - PUBLISHED only for every caller; see /events/managed for other statuses)
      description: >
        An event whose end time has passed is never listed: it is COMPLETED (BR-EVENT-005), on this request if
        the background sweep has not done it yet.
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: lat
          in: query
          schema: { type: number }
        - name: lng
          in: query
          schema: { type: number }
        - name: radius_km
          in: query
          schema: { type: number }
        - name: date_from
          in: query
          schema: { type: string, format: date-time }
        - name: date_to
          in: query
          schema: { type: string, format: date-time }
        - name: price_min
          in: query
          schema: { type: integer }
        - name: price_max
          in: query
          schema: { type: integer }
        - name: sort
          in: query
          schema: { type: string, enum: [date, popularity, price] }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventList" }
    post:
      operationId: createEvent
      tags: [Events]
      summary: Create an Event (organizer or owner, approved org)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventCreate" }
      responses:
        "201":
          description: Created — includes system-generated ticket_number_prefix
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /events/managed:
    get:
      operationId: listManagedEvents
      tags: [Events]
      summary: List events in any status (admin, or owner/organizer of the organizations they manage)
      description: >
        Not public (requires a bearer token). An admin sees every organization's
        events and may narrow by organizationId; an owner or organizer sees only
        events of organizations where they hold that role. Soft-deleted events are
        excluded. A caller who owns/organizes no organization, or who asks for an
        organization they do not manage, gets 403. The public GET /events always
        returns PUBLISHED events only.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, PUBLISHED, ON_SALE, SOLD_OUT, CANCELLED, COMPLETED, SUSPENDED]
        - name: organizationId
          in: query
          schema: { type: string, format: uuid }
        - name: category
          in: query
          schema: { type: string }
        - name: keyword
          in: query
          schema: { type: string }
        - name: startsAfter
          in: query
          schema: { type: string, format: date-time }
        - name: startsBefore
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: A page of events
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items: { $ref: "#/components/schemas/Event" }
                  page: { type: integer }
                  size: { type: integer }
                  totalElements: { type: integer, format: int64 }
                  totalPage: { type: integer }
                  last: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /events/{eventId}:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      operationId: getEvent
      tags: [Events]
      security: []
      summary: Get an Event (public if published; organizer/owner/admin otherwise)
      description: >
        A PUBLISHED, ON_SALE or SOLD_OUT event whose end time has passed is returned as COMPLETED - it is completed on
        this read if the background sweep has not done it yet (BR-EVENT-005).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateEvent
      tags: [Events]
      summary: Update an Event (organizer or owner of the owning organization only - an admin gets 403)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "409": { $ref: "#/components/responses/EventEnded" }
    delete:
      operationId: deleteEvent
      tags: [Events]
      summary: Delete an Event (organizer, owner, or admin)
      description: Soft delete. Refused with 409 once the event has ended (an admin can still take it down through moderation REMOVE).
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/EventEnded" }

  /events/{eventId}/publish:
    parameters:
      - $ref: "#/components/parameters/EventId"
    post:
      operationId: publishEvent
      tags: [Events]
      summary: Transition an Event draft -> published (organizer or owner only - an admin gets 403)
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "409":
          description: Organization not approved, or event not in a publishable state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /events/{eventId}/cancel:
    parameters:
      - $ref: "#/components/parameters/EventId"
    post:
      operationId: cancelEvent
      tags: [Events]
      summary: Cancel an Event (organizer, owner, or admin); triggers refunds for all issued tickets
      responses:
        "202":
          description: Cancellation accepted; refund workflow runs asynchronously
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "409": { $ref: "#/components/responses/EventEnded" }

  /ticket-types/{ticketTypeId}/sales-status:
    parameters:
      - $ref: "#/components/parameters/TicketTypeId"
    put:
      operationId: setTicketTypeSalesStatus
      tags: [TicketTypes]
      summary: Pause or resume selling a ticket type (owning organizer, or admin)
      description: |
        Sets the ticket type's sales state. PAUSED: it can no longer be added to a cart (409) and a cart that already
        holds it can no longer check out (409; nothing is charged, the cart and its holds are kept so the buyer can
        check out once selling resumes). ACTIVE: normal selling again - the sale window and the event's status still
        decide whether it can actually be bought. Tickets already sold are untouched. Asking for the state it is
        already in is not an error. This is the same switch as `sales_paused` on the update.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketTypeSalesStatus" }
      responses:
        "200":
          description: The ticket type, with its new `sales_paused`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketType" }
        "400": { description: "Missing or unknown status" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/EventEnded" }

  /events/{eventId}/seatmap:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      operationId: getEventSeatMap
      tags: [SeatMaps]
      security: []
      summary: Get the event's seat map with live seat status (reserved-seating events only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeatMap" }
        "404":
          description: Event has no seat map (GA-only)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /events/{eventId}/ticket-types:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      operationId: listTicketTypes
      tags: [TicketTypes]
      security: []
      summary: List an event's ticket types (public if event published)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TicketType" }
    post:
      operationId: createTicketType
      tags: [TicketTypes]
      summary: Create a TicketType (owning organizer)
      description: |
        Omit `sale_start_at` to start sales now (the server's current time). `sale_end_at` must be at least 1 hour after
        `sale_start_at` (measured from the server's time when it is omitted) and at least 1 hour before the event
        starts; otherwise 400 (BR-EVENT-003).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketTypeCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketType" }
        "400": { description: "Validation error, a sale window shorter than 1 hour, or one ending less than 1 hour before the event starts" }
        "409": { $ref: "#/components/responses/EventEnded" }

  /events/{eventId}/ticket-types/order:
    parameters:
      - $ref: "#/components/parameters/EventId"
    put:
      operationId: reorderTicketTypes
      tags: [TicketTypes]
      summary: Save the arrangement of an event's ticket types (owning organizer, or admin)
      description: |
        The organizer drags ticket types into order; this saves it. `ticket_type_ids` is the whole list, first to last:
        they become positions 0..n-1 and the list endpoint returns them in that order. It must contain every
        ticket type of the event exactly once - a list that omits, repeats or invents one (a stale screen, another
        event's id, a deleted ticket type) is refused with 400 and nothing changes. New ticket types go to the end.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketTypeOrder" }
      responses:
        "200":
          description: The event's ticket types in the new order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TicketType" }
        "400": { description: "Empty list, or not exactly the event's ticket types" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/EventEnded" }

  /ticket-types/{ticketTypeId}:
    parameters:
      - $ref: "#/components/parameters/TicketTypeId"
    get:
      operationId: getTicketType
      tags: [TicketTypes]
      security: []
      summary: Get a TicketType
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketType" }
    patch:
      operationId: updateTicketType
      tags: [TicketTypes]
      summary: Update a TicketType (owning organizer)
      description: |
        A new `quantityTotal` keeps the tickets already sold or held taken: `quantityAvailable` becomes the new total minus
        (old total - old available). A total lower than what is already sold or held is refused with 409.
        The resulting sale window (new or kept values) must run for at least 1 hour and end at least 1 hour before the
        event starts; otherwise 400 (BR-EVENT-003).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketTypeUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketType" }
        "400": { description: "Validation error, a sale window shorter than 1 hour, or one ending less than 1 hour before the event starts" }
        "409": { $ref: "#/components/responses/EventEnded" }
    delete:
      operationId: deleteTicketType
      tags: [TicketTypes]
      summary: Delete a TicketType (owning organizer)
      description: Soft delete. Refused with 409 once the type has sales, held tickets or ticket rows - pause its sales instead.
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Has sales or held tickets, or the event has ended (`Event has ended`)" }

  /events/{eventId}/promo-codes:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      operationId: listPromoCodes
      tags: [PromoCodes]
      summary: List an event's promo codes (owning organizer)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PromoCode" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createPromoCode
      tags: [PromoCodes]
      summary: Create a PromoCode for an event (owning organizer)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromoCodeCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PromoCode" }
        "409": { $ref: "#/components/responses/EventEnded" }

  /promo-codes/{promoCodeId}:
    parameters:
      - name: promoCodeId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updatePromoCode
      tags: [PromoCodes]
      summary: Edit a promo code (owning organizer, or admin)
      description: |
        Every field is optional; omitted or null = unchanged. To remove a limit send 0 (0 = no limit); to apply the
        code to every ticket type send an empty `applicable_ticket_type_ids`. `valid_until` must be after `valid_from`
        (checked on the merged values), a percentage is at most 100, and the ticket types must belong to the code's
        own event. A `code` the event already has is 409. Once the code has been used (`used_count` > 0) its `code`
        and `discount_type` can no longer change (409 - pause it and create a new one) and `usage_limit_total` can't
        go below `used_count` (400); everything else can still be edited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromoCodeUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PromoCode" }
        "400": { description: "Invalid value (e.g. validity window, percentage over 100, ticket type of another event, total limit below the uses)" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "The code already exists for the event, the code / discount type of a used code was changed, or the event has ended (`Event has ended`)" }
    delete:
      operationId: deletePromoCode
      tags: [PromoCodes]
      summary: Delete a promo code that has not been used (owning organizer, or admin)
      description: Soft delete. A code that orders have used (`used_count` > 0) can't be deleted (409) - pause it instead. A cart that still holds a deleted code simply loses the discount and can't check out with it. The code's name can be created again afterwards.
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "The code has already been used, so it can't be deleted, or the event has ended (`Event has ended`)" }

  /promo-codes/{promoCodeId}/status:
    parameters:
      - name: promoCodeId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: setPromoCodeStatus
      tags: [PromoCodes]
      summary: Pause or resume a promo code (owning organizer, or admin)
      description: |
        PAUSED: the code can't be applied to a cart (422, like an unknown code) and a cart that already holds it can't
        check out (422, nothing charged). ACTIVE: usable again. Orders that already used it are untouched. Allowed
        whatever the event's status until the event has ended (then 409); asking for the state it is already in is
        not an error.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromoCodeStatus" }
      responses:
        "200":
          description: The promo code with its new `paused`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PromoCode" }
        "400": { description: Missing or unknown status }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/EventEnded" }

  /events/{eventId}/waitlist:
    parameters:
      - $ref: "#/components/parameters/EventId"
    post:
      operationId: joinWaitlist
      tags: [Waitlist]
      summary: Join the waitlist for a sold-out event or ticket type
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ticket_type_id:
                  type: string
                  format: uuid
                  description: Omit to wait for the event generally.
      responses:
        "201":
          description: Joined
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaitlistEntry" }
        "409":
          description: Event/ticket type is not currently sold out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /events/{eventId}/resale-policy:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      operationId: getResalePolicy
      tags: [Resale]
      security: []
      summary: Get an event's resale policy (public — a buyer needs to know before listing)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResalePolicy" }
    patch:
      operationId: updateResalePolicy
      tags: [Resale]
      summary: Enable/disable resale and set a price cap for an event (owning organizer)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResalePolicyUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResalePolicy" }

  /events/{eventId}/resale-listings:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      operationId: listResaleListings
      tags: [Resale]
      security: []
      summary: Browse active resale listings for an event (public)
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ResaleListing" }

  /events/{eventId}/refund-policy:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      operationId: getRefundPolicy
      tags: [Refunds]
      summary: Get an event's refund policy (organizer, admin, or a buyer with an order on it)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefundPolicy" }
    patch:
      operationId: updateRefundPolicy
      tags: [Refunds]
      summary: Set an event's refund policy (owning organizer)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefundPolicyUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefundPolicy" }

  /events/{eventId}/ticket-templates:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      operationId: listTicketTemplates
      tags: [TicketTemplates]
      summary: List an event's ticket templates (owning organizer)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TicketTemplate" }
    post:
      operationId: createTicketTemplate
      tags: [TicketTemplates]
      summary: Submit a physical or digital ticket layout for an event or ticket type (owning organizer)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketTemplateCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketTemplate" }
        "409": { $ref: "#/components/responses/EventEnded" }

  /ticket-templates/{templateId}:
    parameters:
      - name: templateId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateTicketTemplate
      tags: [TicketTemplates]
      summary: Update a ticket template (owning organizer)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketTemplateUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketTemplate" }
        "409": { $ref: "#/components/responses/EventEnded" }
    delete:
      operationId: deleteTicketTemplate
      tags: [TicketTemplates]
      summary: Delete a ticket template (owning organizer, or admin)
      description: Soft delete - the template stops being listed or used; tickets fall back to the event-level template or the built-in layout.
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/EventEnded" }

  /events/{eventId}/activity:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      operationId: listEventActivity
      tags: [Events]
      summary: The event's activity history, newest first (owning organization's owner or organizer, or admin)
      description: >
        BR-EVENT-006. Who did what to the event and when: the event itself (created, updated, published, cancelled,
        deleted, completed - the system completes it, so actor_id is null), its ticket types, promo codes, ticket
        templates, refund and resale policies, check-in configuration and scanner devices, refunds issued on its
        orders, and admin moderation of it. Check-in scans and posts are not listed. A deleted event's history can
        still be read.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, default: 20 } }
      responses:
        "200":
          description: A page of activity entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items: { $ref: "#/components/schemas/AuditLogEntry" }
                  page: { type: integer }
                  size: { type: integer }
                  totalElements: { type: integer, format: int64 }
                  totalPage: { type: integer }
                  last: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/{eventId}/analytics:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      operationId: getEventAnalytics
      tags: [Analytics]
      summary: >
        Sales analytics for one event (owning organizer/owner or admin -
        the spec previously omitted admin here, unlike sibling
        owner/organizer-gated endpoints; BR-AUTH-004 grants admins
        platform-wide access with no stated exceptions, so this was
        corrected to match every other implemented endpoint in this
        category)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventAnalytics" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /events/{eventId}/analytics/audience:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      operationId: getEventAudience
      tags: [Analytics]
      summary: Who bought tickets for an event, by age group (owning organizer/owner or admin)
      description: |
        Aggregates only: never a birth date or a user id. `buyers` counts the distinct buyers with a PAID or PARTIALLY_REFUNDED order for the
        event; each falls in one age group by their age (from their birth date) at their first such order, or in `unknownAge` without a birth
        date. A group's `tickets` are its buyers' live tickets (not REFUNDED or CANCELLED). A group of 1 to 4 buyers comes back with `buyers` and
        `tickets` null ("fewer than 5"); when only one group is that small, the next smallest group is hidden too, so the small one cannot be
        worked out from `buyers` minus the others. A group with no buyers shows 0.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventAudience" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/{eventId}/views:
    parameters:
      - $ref: "#/components/parameters/EventId"
    post:
      operationId: recordEventView
      tags: [Analytics]
      summary: Record that a visitor opened a public event page (public)
      description: |
        Feeds the event funnel (BR-ANALYTICS-003). Always answers 204, whatever happened, so it never reveals whether the event exists or the
        view was counted. A view is stored at most once per event and visitor per 30 minutes. The visitor is the signed-in user when a bearer
        token is sent, else a SHA-256 of `visitorId` (a random id the web app keeps in localStorage); IP addresses are never stored. Not
        counted: the event's own owner and organizers, admins, events that are not PUBLISHED, ON_SALE, SOLD_OUT or COMPLETED, unknown events,
        an anonymous call without `visitorId`, and a client over 60 calls a minute.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                visitorId: { type: string, maxLength: 100, description: "The browser's random visitor id (a UUID); ignored when signed in." }
      responses:
        "204": { description: Received (counted or not). }
        "400": { description: The body is not JSON. }

  /events/{eventId}/analytics/funnel:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      operationId: getEventFunnel
      tags: [Analytics]
      summary: An event's funnel - views, add-to-cart and checkout (owning organizer/owner or admin)
      description: |
        From the view and cart activity logs (BR-ANALYTICS-003), for the days `from`..`to` in the event's time zone. `daily` has every day of the
        range and `ticketTypes` every ticket type of the event in its arranged order, with zeros when nothing happened. `cartConversionRate` is
        checked-out / added quantity (null when nothing was added); `viewToCartRate` is buyers who added / unique visitors and
        `viewToPurchaseRate` buyers who checked out / unique visitors (null without views). Nothing before `trackingSince` was recorded.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date }, description: "First day (default: the day the event was created, at most 366 days before `to`)." }
        - { name: to, in: query, schema: { type: string, format: date }, description: "Last day, included (default: today). At most 366 days." }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventFunnel" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/{eventId}/analytics/sales-patterns:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      operationId: getEventSalesPatterns
      tags: [Analytics]
      summary: When an event's tickets sell - per day, weekday and hour (owning organizer/owner or admin)
      description: |
        Computed in the database from the event's PAID and PARTIALLY_REFUNDED orders and their live tickets (not REFUNDED or CANCELLED), so it
        stays right for events of any size. Days and hours are in the event's time zone. `daily` has every day from the first sale to today or
        the event's end, whichever is first, with 0 for days without sales (empty when nothing has sold). `byWeekday` has 7 ticket counts,
        Monday first; `byHour` has 24.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventSalesPatterns" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /analytics/platform:
    get:
      operationId: getPlatformAnalytics
      tags: [Analytics]
      summary: Platform-wide aggregate metrics (admin only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformAnalytics" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /carts:
    post:
      operationId: createCart
      tags: [Cart]
      summary: Create an empty Cart for the caller
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }

  /carts/{cartId}:
    parameters:
      - $ref: "#/components/parameters/CartId"
    get:
      operationId: getCart
      tags: [Cart]
      summary: Get a Cart (owning buyer only), optionally priced for only some of its items
      description: |
        With `itemIds` the response is the cart shape for ONLY those items (`items`, promo, platform fee, gateway fee and `total`), worked out
        with the same rules as checkout, so it is exactly what `POST /carts/{cartId}/checkout` with the same `itemIds` will charge. Without it the
        whole cart, as before. A promo code counts only if it fits the selected items (otherwise `appliedPromoCode` is null here and the code stays
        on the cart). The platform fee's fixed part is per ticket, so the fees of a cart paid in parts add up to the fee of the whole cart.
      parameters:
        - name: itemIds
          in: query
          required: false
          description: Cart item ids, comma-separated (`?itemIds=a,b`). Omit for the whole cart; an empty value is a 400.
          schema: { type: array, items: { type: string, format: uuid } }
          style: form
          explode: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "400":
          description: An item id is not in this cart (or itemIds is empty)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: The hold on a selected item has expired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /carts/{cartId}/items:
    parameters:
      - $ref: "#/components/parameters/CartId"
    post:
      operationId: addCartItem
      tags: [Cart]
      summary: Add an item to the cart; places a temporary Hold
      description: |
        A general-admission ticket type has ONE line per cart: adding it again adds the quantity to the existing line (a new line is created
        only the first time), which keeps its hold expiry. The ticket type's `maxPerOrder` applies to the merged quantity (409 when
        exceeded). A reserved seat is always its own line. Carts that already have several lines of one ticket type are left as they are.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket_type_id]
              properties:
                ticket_type_id: { type: string, format: uuid }
                seat_id:
                  type: string
                  format: uuid
                  description: Required for reserved-seating ticket types.
                quantity:
                  type: integer
                  minimum: 1
                  default: 1
                  description: Used for GA ticket types; ignored if seat_id is set.
      responses:
        "201":
          description: Item added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "409":
          description: >
            Seat or GA quantity no longer available, not on sale, or the event has ended (`Event has ended` - even when
            the ticket type's sale window runs past the event's end)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /carts/{cartId}/items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/CartId"
      - name: itemId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: removeCartItem
      tags: [Cart]
      summary: Remove an item and release its Hold
      responses:
        "204": { description: Removed }
    patch:
      operationId: updateCartItemQuantity
      tags: [Cart]
      summary: Change the quantity of a general-admission line (owning buyer only)
      description: |
        Sets the line's quantity and adjusts the held inventory by the difference in one transaction: raising it needs enough tickets
        available (and the ticket type still on sale), lowering it gives the difference back at once. The line keeps its hold expiry (a change
        never extends it). The ticket type's `maxPerOrder` applies. A quantity below 1 is a 400 (use DELETE to remove the line). Prices, fees
        and checkout work from the new quantity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1 }
      responses:
        "200":
          description: The cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "400":
          description: quantity below 1
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such line in this cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: A reserved seat (quantity is fixed), an expired hold, not enough tickets available, over maxPerOrder, no longer on sale, or (when raising it) the event has ended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /carts/{cartId}/promo-code:
    parameters:
      - $ref: "#/components/parameters/CartId"
    post:
      operationId: applyPromoCode
      tags: [Cart]
      summary: Apply a promo code to the cart; adjusts the total before payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: Applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "422":
          description: Code is expired, exhausted, or inapplicable to the items in the cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: removePromoCode
      tags: [Cart]
      summary: Remove the promo code currently applied to the cart
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }

  /carts/{cartId}/checkout:
    parameters:
      - $ref: "#/components/parameters/CartId"
    post:
      operationId: checkout
      tags: [Cart]
      summary: "Charge the cart and issue tickets (with PayMongo: start the payment)"
      description: |
        Mock and Stripe gateways charge at once and answer 201 with the order. With the PayMongo gateway the card is entered in the
        browser, so this only starts the payment: it answers 202 with a `checkoutId` and the intent's `clientKey` (send an empty body
        `{}`); the order exists once PayMongo's webhook confirms the payment, see `GET /checkouts/{checkoutId}`.

        `itemIds` pays only those cart items: the order, the fee snapshots and the charge are for them alone, and the other items stay in the
        cart with their holds unchanged (a cart can therefore have several orders). Quote it first with `GET /carts/{cartId}?itemIds=`. A promo
        code applies only if its rules are met by the selected items; otherwise it is left out of that order and kept on the cart. The
        platform fee's fixed part is per ticket, so paying in parts costs the same in total. The idempotency key covers the selection: the same key with other `itemIds` is a 409.
        With PayMongo the selection is stored with the pending checkout and the webhook issues the order for exactly those items.

        **Paying with a saved card (PayMongo):** send `paymentMethodId` (a card from `/users/me/payment-methods` with `canChargeAgain: true`),
        `securityCode` and `returnUrl`. The server creates the payment intent and attaches the stored payment method itself, then answers
        202 with `nextAction`: NONE (the webhook completes the order) or REDIRECT with `redirectUrl` (3-D Secure). Another user's card is a
        404, a card without a stored payment method a 409 "Re-enter this card to use it again", a declined card a 402 (cart and holds
        intact, the idempotency key is free again). A repeated call with the same idempotency key does not attach the card twice. A new card
        keeps the browser flow (`clientKey`); add `saveCard: true` to vault it.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Exactly one of paymentMethodToken or paymentMethodId.
              properties:
                paymentMethodToken:
                  type: string
                  description: Client-side token from the payment gateway; the API never receives raw card data.
                paymentMethodId:
                  type: string
                  format: uuid
                  description: A card the signed-in user saved under /users/me/payment-methods (another user's card is a 404).
                itemIds:
                  type: array
                  items: { type: string, format: uuid }
                  description: Optional. Pay only these cart items; omitted = the whole cart. Empty, or an id not in the cart, is a 400.
                securityCode:
                  type: string
                  pattern: "^[0-9]{3,4}$"
                  description: PayMongo, with paymentMethodId only (required then). The card's security code, set on the payment method for this one payment. Never stored or logged.
                returnUrl:
                  type: string
                  description: PayMongo, with paymentMethodId only (required then, http or https). Where the bank sends the buyer back after 3-D Secure.
                saveCard:
                  type: boolean
                  description: "PayMongo, new card (no paymentMethodId): vault the card typed in the browser for later. It is saved once the payment succeeds, and then listed in /users/me/payment-methods."
      responses:
        "201":
          description: Order created and tickets issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "202":
          description: PayMongo only. Payment started; attach the card in the browser with `clientKey` and poll `GET /checkouts/{checkoutId}`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutStart" }
        "402":
          description: |
            Payment failed (declined card, or a card that needs 3-D Secure, which is not supported yet); cart and holds remain
            intact for retry. With the Stripe gateway the payment method must be a Stripe pm_ id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: A hold expired before checkout completed (a selected item's hold, when itemIds is given)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >
            Nothing to check out, a payment for this key is already in progress, the idempotency key was used with
            another itemIds, or the event has ended (`Event has ended`; nothing is charged - and a payment that
            completes after the end is refunded instead of issuing tickets)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /checkouts/{checkoutId}:
    parameters:
      - name: checkoutId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getCheckout
      tags: [Cart]
      summary: Status of a checkout waiting for the payment provider (PayMongo)
      description: PENDING until the webhook arrives, then PAID (with the `orderId`), FAILED, or REFUNDED. Only the buyer who started it can read it (another buyer gets 404).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutStart" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /webhooks/paymongo:
    post:
      operationId: payMongoWebhook
      tags: [Cart]
      summary: PayMongo's callback for payment.paid / payment.failed (PayMongo only, public, signature-checked)
      description: |
        Not called by the web app. Authenticated by the `Paymongo-Signature` header (`t=<timestamp>,te=<test>,li=<live>`: hex HMAC-SHA256
        of "<timestamp>.<raw body>" with the webhook secret); a bad or missing signature is a 401 and changes nothing. Idempotent. Register this
        URL in the PayMongo dashboard for the events payment.paid and payment.failed. Only exists when payments.gateway=paymongo.
      responses:
        "200": { description: Accepted (also for event types that are ignored) }
        "400": { description: Body is not JSON }
        "401": { description: Bad or missing signature }

  /orders/{orderId}:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    get:
      operationId: getOrder
      tags: [Orders]
      summary: Get an Order (owning buyer, event organizer/owner, or admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }

  /orders/{orderId}/tickets:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    get:
      operationId: listOrderTickets
      tags: [Tickets]
      summary: List tickets on an order
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Ticket" }

  /orders/{orderId}/refunds:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    get:
      operationId: listOrderRefunds
      tags: [Refunds]
      summary: List refunds issued against an order
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Refund" }
    post:
      operationId: createRefund
      tags: [Refunds]
      summary: Issue a full or partial refund for an order (owning organizer or admin), subject to the event's refund policy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefundCreate" }
      responses:
        "201":
          description: Refund initiated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Refund" }
        "409":
          description: Refund not permitted under the event's refund policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /events/{eventId}/orders:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      operationId: listEventOrders
      tags: [Orders]
      summary: List orders for an event (owning organizer/owner or admin)
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderList" }

  /tickets/{ticketId}:
    parameters:
      - $ref: "#/components/parameters/TicketId"
    get:
      operationId: getTicket
      tags: [Tickets]
      summary: Get a Ticket (owning buyer, event organizer, or admin). Never returns the raw scannable credential.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }

  /tickets/{ticketId}/artifact:
    parameters:
      - $ref: "#/components/parameters/TicketId"
    get:
      operationId: getTicketArtifact
      tags: [Tickets]
      summary: Get the rendered, deliverable ticket (PDF/image) carrying the QR/barcode and visible ticket_number
      parameters:
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [digital, physical] }
      responses:
        "200":
          description: The rendered ticket file
          content:
            application/pdf: {}
            image/png: {}

  /tickets/{ticketId}/transfer:
    parameters:
      - $ref: "#/components/parameters/TicketId"
    post:
      operationId: transferTicket
      tags: [Tickets]
      summary: Transfer a ticket to another registered user (owning buyer only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to_user_id]
              properties:
                to_user_id: { type: string, format: uuid }
      responses:
        "200":
          description: >
            Transferred — the previous credential is invalidated and a
            new one is issued to the recipient.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }

  /tickets/{ticketId}/transfers:
    parameters:
      - $ref: "#/components/parameters/TicketId"
    get:
      operationId: listTicketTransfers
      tags: [Tickets]
      summary: Ownership-change history for a ticket (owning buyer, event organizer, or admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TicketTransfer" }

  /tickets/{ticketId}/resale-listings:
    parameters:
      - $ref: "#/components/parameters/TicketId"
    post:
      operationId: createResaleListing
      tags: [Resale]
      summary: >
        List a ticket for resale (owning buyer only). Rejected if the
        event's ResalePolicy has resale disabled, the asking price
        exceeds its price cap, or the ticket already has an active
        listing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asking_price]
              properties:
                asking_price: { $ref: "#/components/schemas/Money" }
      responses:
        "201":
          description: Listed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResaleListing" }
        "403":
          description: Resale disabled for this event, or price exceeds the cap
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Ticket already has an active resale listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /resale-listings/{listingId}:
    parameters:
      - name: listingId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: cancelResaleListing
      tags: [Resale]
      summary: Cancel an active resale listing (owning seller only)
      responses:
        "204": { description: Cancelled }

  /resale-listings/{listingId}/purchase:
    parameters:
      - name: listingId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: purchaseResaleListing
      tags: [Resale]
      summary: >
        Buy a resale-listed ticket. Runs like checkout: creates an Order
        (payee is the reselling User, not the Organization), and on
        payment success creates a TicketTransfer and reassigns the
        ticket's owner.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_method_token]
              properties:
                payment_method_token: { type: string }
      responses:
        "201":
          description: Purchased — ticket transferred to the buyer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "409":
          description: Listing is no longer active
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /tickets/{ticketId}/check-in-records:
    parameters:
      - $ref: "#/components/parameters/TicketId"
    get:
      operationId: listTicketCheckInRecords
      tags: [CheckIn]
      summary: Audit trail of scan attempts against a ticket (owning organizer or admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CheckInRecord" }

  /events/{eventId}/check-in-config:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      operationId: getCheckInConfig
      tags: [CheckIn]
      summary: Get an event's check-in mode/config
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckInConfig" }
    patch:
      operationId: updateCheckInConfig
      tags: [CheckIn]
      summary: Set an event's check-in mode/config (owning organizer). Mode is always an explicit manual choice, never inferred.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { type: string, enum: [standard, pure_offline] }
                offline_fallback_expiry_seconds: { type: integer, default: 300 }
      responses:
        "200":
          description: Updated. If a mode switch occurs while a device holds unsynced scans, a warning is included.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckInConfig" }

  /events/{eventId}/scanner-devices:
    parameters:
      - $ref: "#/components/parameters/EventId"
    post:
      operationId: authorizeScannerDevice
      tags: [CheckIn]
      summary: Authorize a new ScannerDevice for an event (owning organizer)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                device_label: { type: string }
                force_replace:
                  type: boolean
                  default: false
                  description: Required to replace the sole device in pure_offline mode (the override flow, requirements 4.11).
      responses:
        "201":
          description: Authorized — credential is shown once, here, and never again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScannerDeviceWithCredential" }
        "409":
          description: pure_offline mode already has an active device; retry with force_replace true
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /scanner-devices/{deviceId}:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    delete:
      operationId: revokeScannerDevice
      tags: [CheckIn]
      summary: Revoke a device's credential immediately (owning organizer)
      responses:
        "204": { description: Revoked }

  /scanner-devices/{deviceId}/dataset:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    get:
      operationId: getScannerDeviceDataset
      tags: [CheckIn]
      security:
        - deviceAuth: []
      summary: Pre-fetch the ticket dataset for offline validation
      responses:
        "200":
          description: >
            Full event ticket dataset. In pure_offline mode this has no
            expiry for the sole device; in standard mode the client must
            treat it as stale after CheckInConfig.offline_fallback_expiry_seconds.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketDataset" }

  /check-in/validate:
    post:
      operationId: validateScan
      tags: [CheckIn]
      security:
        - deviceAuth: []
      summary: Validate a scanned credential in real time
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential, device_id]
              properties:
                credential: { type: string, description: Raw scanned QR/barcode payload }
                device_id: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationResult" }

  /check-in/fallback-scans:
    post:
      operationId: submitFallbackScans
      tags: [CheckIn]
      security:
        - deviceAuth: []
      summary: >
        Batch-upload raw scans captured by the fallback recorder while the
        sole ScannerDevice was down (pure_offline mode only, requirements 4.11).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_id, scans]
              properties:
                event_id: { type: string, format: uuid }
                scans:
                  type: array
                  items:
                    type: object
                    required: [raw_credential, captured_at]
                    properties:
                      raw_credential: { type: string }
                      captured_at: { type: string, format: date-time }
      responses:
        "200":
          description: Per-scan reconciled results; duplicates are flagged, not resolved automatically.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ValidationResult" }

  /disputes:
    get:
      operationId: listDisputes
      tags: [Disputes]
      summary: List disputes (admin only)
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [open, investigating, resolved, dismissed] }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Dispute" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createDispute
      tags: [Disputes]
      summary: Raise a dispute against an order or ticket (e.g. buyer-reported fraud)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisputeCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dispute" }

  /disputes/{disputeId}:
    parameters:
      - name: disputeId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getDispute
      tags: [Disputes]
      summary: Get a dispute (the user who raised it, or admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dispute" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateDispute
      tags: [Disputes]
      summary: Update a dispute's status/resolution (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisputeUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dispute" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/moderation-actions:
    get:
      operationId: listModerationActions
      tags: [Moderation]
      summary: >
        List admin moderation actions (admin only). Not in the original
        design docs (BR-ADMIN-002) - added in Phase 12 as a single unified,
        append-only audit trail for suspend/reinstate/remove actions against
        an Organization, Event, or User.
      parameters:
        - name: target_type
          in: query
          schema: { type: string, enum: [organization, event, user] }
        - name: target_id
          in: query
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ModerationAction" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createModerationAction
      tags: [Moderation]
      summary: >
        Suspend, reinstate, or remove an Organization/Event/User (admin
        only). Every call is recorded as its own immutable row, doubling as
        the reason/audit trail BR-ADMIN-002 calls for. When the target is
        an ADMIN account only the super admin may act (an admin gets 403),
        and nobody may act on the SUPER_ADMIN account (403).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModerationActionCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationAction" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            The target is already in the requested state (e.g. SUSPEND on an
            already-suspended target, REINSTATE on a non-suspended one,
            REMOVE on an already-removed one).

  /audit-log:
    get:
      operationId: listAuditLog
      tags: [Audit]
      summary: List audit log entries for sensitive actions (admin only)
      parameters:
        - name: actor_id
          in: query
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditLogEntry" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    deviceAuth:
      type: http
      scheme: bearer
      description: A ScannerDevice's own credential, issued by POST /events/{eventId}/scanner-devices.

  parameters:
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 20, maximum: 100 }
    OrgId:
      name: orgId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FinanceEventId:
      name: eventId
      in: query
      description: Only this event's figures. 404 for an unknown event, 400 for an event of another organization.
      schema: { type: string, format: uuid }
    VenueId:
      name: venueId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EventId:
      name: eventId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TicketTypeId:
      name: ticketTypeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CartId:
      name: cartId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TicketId:
      name: ticketId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated, but not permitted (wrong role/scope)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    EventEnded:
      description: >
        Event has ended (BR-EVENT-005): the event is COMPLETED, or its end time has passed even if it has not been
        marked COMPLETED yet. An ended event is read-only and sells nothing.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Request failed validation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  issue: { type: string }

    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: integer, description: Minor units (e.g. cents) }
        currency: { type: string, description: ISO 4217, example: USD }

    TokenPair:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        middleName: { type: [string, "null"] }
        lastName: { type: string, description: Empty for an older account that had a single-word name. }
        birthDate: { type: [string, "null"], format: date, description: Null for an account created before the date of birth was collected. }
        phoneNumber: { type: [string, "null"], description: "International format (+ then digits), or null when none was given." }
        email: { type: string, format: email }
        role:
          type: string
          enum: [CUSTOMER, ADMIN, SUPER_ADMIN]
          description: |
            SUPER_ADMIN is the one highest account (exactly one exists; it cannot be granted through the API). It has every admin
            power and is the only role that may suspend, remove, delete or demote an ADMIN or make someone an ADMIN.
            Through `PATCH /users/{id}` an admin may change a customer's other fields, but a role change to or from ADMIN
            needs the super admin (403 otherwise), and the SUPER_ADMIN role is never accepted (403).
        is_admin: { type: boolean }
        avatarUrl:
          type: [string, "null"]
          description: The user's profile picture - a URL on this server's `/uploads/files/` - or null when none is set. Set through `PATCH /users/me`.
        organizations:
          type: array
          description: One entry per organization the user has any role in.
          items:
            type: object
            properties:
              organization_id: { type: string, format: uuid }
              roles:
                type: array
                description: Combinable, not mutually exclusive — e.g. an owner may also be an organizer and/or check_in_staff for the same organization.
                items: { type: string, enum: [owner, organizer, check_in_staff] }
        created_at: { type: string, format: date-time }
        created_by:
          type: [string, "null"]
          format: uuid
          description: User who created this account (e.g. an inviting admin); null for ordinary self-registration.

    Organization:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status:
          type: string
          enum: [pending, approved, rejected]
          description: An application in `pending` grants no organization privileges. Only `approved` gains an owner and can publish events or receive payouts.
        documents:
          type: array
          description: Verification documents submitted with the application (e.g. business permit).
          items:
            type: object
            properties:
              type: { type: string, example: business_permit }
              url: { type: string, format: uri }
        owner_id:
          type: [string, "null"]
          format: uuid
          description: Set only once the application is approved; equals the original applicant (created_by).
        created_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid, description: The applicant who submitted this organization's application. }

    OrganizationCreate:
      type: object
      required: [name, documents]
      properties:
        name: { type: string }
        documents:
          type: array
          minItems: 1
          items:
            type: object
            required: [type, url]
            properties:
              type: { type: string, example: business_permit }
              url: { type: string, format: uri }

    OrganizationUpdate:
      type: object
      properties:
        name: { type: string }

    OrganizationMember:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        roles:
          type: array
          items: { type: string, enum: [owner, organizer, check_in_staff] }
        assigned_at: { type: string, format: date-time }

    OrganizationMemberAssign:
      type: object
      required: [user_id, role]
      properties:
        user_id:
          type: string
          format: uuid
          description: Set equal to the caller's own id to self-assign.
        role:
          type: string
          enum: [organizer, check_in_staff]
          description: owner cannot be granted here — it's only ever set by organization-application approval.

    UploadedImage:
      type: object
      properties:
        url: { type: string, format: uri, description: Absolute URL the image is served from. }
        contentType: { type: string }
        size: { type: integer, description: Bytes. }

    Post:
      type: object
      description: A sale or an announcement. `eventId` is null for a site-wide post.
      required: [id, kind, title, body, hidden, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        eventId: { type: [string, "null"], format: uuid }
        eventTitle: { type: [string, "null"], description: "Title of the event; null for a site-wide post." }
        kind: { type: string, enum: [ANNOUNCEMENT, SALE] }
        title: { type: string, minLength: 1, maxLength: 120 }
        body: { type: string, maxLength: 2000, description: May be empty. }
        imageUrl: { type: [string, "null"], description: "The post's optional picture - a URL on this server's `/uploads/files/` - or null for a text-only post." }
        publishAt: { type: [string, "null"], format: date-time, description: "Not public before this moment; null = public as soon as it was created." }
        expiresAt: { type: [string, "null"], format: date-time, description: "Not public from this moment on; null = never expires." }
        hidden: { type: boolean, description: "Admin switch: a hidden post is never public, whatever its dates say." }
        status:
          type: string
          enum: [HIDDEN, EXPIRED, SCHEDULED, LIVE]
          description: "Where the post stands right now. Only LIVE posts are in the public list."
        createdAt: { type: string, format: date-time }

    PostCreate:
      type: object
      required: [kind, title]
      properties:
        eventId: { type: [string, "null"], format: uuid, description: "The event the post is about; omit or null for a site-wide post. It must exist and not be deleted." }
        kind: { type: string, enum: [ANNOUNCEMENT, SALE] }
        title: { type: string, minLength: 1, maxLength: 120, description: Trimmed; must not contain HTML. }
        body: { type: string, maxLength: 2000, description: Trimmed; may be empty or omitted; must not contain HTML. }
        imageUrl:
          type: [string, "null"]
          maxLength: 500
          description: Optional picture - the URL returned by `POST /uploads` on this server. Any other link, or a file that no longer exists, is a 400. Blank or omitted = no picture.
        publishAt: { type: [string, "null"], format: date-time, description: "Schedule the post: it is public from this moment. Omit or null = public right away. A time in the past means right away." }
        expiresAt: { type: [string, "null"], format: date-time, description: "Take the post down at this moment. Omit or null = never. Must be in the future and after publishAt." }
        hidden: { type: boolean, default: false, description: "Create the post hidden - kept off the public list until an admin unhides it." }

    PostUpdate:
      type: object
      description: Every field is optional; one that is left out (or null) is not changed.
      properties:
        kind: { type: string, enum: [ANNOUNCEMENT, SALE] }
        title: { type: string, minLength: 1, maxLength: 120 }
        body: { type: string, maxLength: 2000 }
        imageUrl:
          type: string
          maxLength: 500
          description: URL returned by `POST /uploads` on this server to replace the picture; "" removes it; omitted or null leaves it unchanged. Sending the URL the post already has changes nothing. A replaced or removed file is deleted from storage unless another post, a user's avatar, a ticket template, an event image or an organization document still uses it.
        publishAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: "May be in the past, which ends the post right now." }
        hidden: { type: boolean }
        clearPublishAt: { type: boolean, default: false, description: "true removes the publish time (public right away). Cannot be sent together with publishAt." }
        clearExpiresAt: { type: boolean, default: false, description: "true removes the expiry (never expires). Cannot be sent together with expiresAt." }

    PostPage:
      type: object
      properties:
        content:
          type: array
          items: { $ref: "#/components/schemas/Post" }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPage: { type: integer }
        last: { type: boolean }

    Category:
      type: object
      description: An event category. An event's `category` must be the name of an active Category (matched case-insensitively, stored with this canonical spelling).
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string, description: "URL-safe form of the name, e.g. arts-theatre." }
        description: { type: [string, "null"] }
        active: { type: boolean }
        sort_order: { type: integer }

    CategoryCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 255 }
        sort_order: { type: integer }

    CategoryUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 255 }
        sort_order: { type: integer }
        active: { type: boolean }

    Venue:
      type: object
      description: A reusable physical (or virtual) location, owned by the Organization that added it, referenced by Event via venue_id.
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        name: { type: string }
        address: { type: [string, "null"], description: "Null for a purely virtual venue." }
        latitude: { type: [number, "null"] }
        longitude: { type: [number, "null"] }
        created_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid, description: User (organizer) who added this venue. }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string, format: uuid }

    VenueCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        address: { type: string }
        latitude: { type: number }
        longitude: { type: number }

    VenueUpdate:
      type: object
      properties:
        name: { type: string }
        address: { type: string }
        latitude: { type: number }
        longitude: { type: number }

    Event:
      type: object
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        category: { type: string }
        venue:
          type: [object, "null"]
          description: Snapshot of the referenced Venue at read time, for convenience; null for a fully virtual event with no venue_id.
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            address: { type: string }
            latitude: { type: [number, "null"] }
            longitude: { type: [number, "null"] }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        timezone: { type: string, example: Asia/Manila }
        images:
          type: array
          items: { type: string, format: uri }
        status: { type: string, enum: [draft, published, on_sale, sold_out, cancelled, completed] }
        ticket_number_prefix:
          type: string
          minLength: 3
          maxLength: 3
          description: Random 3-letter (A-Z) code, reserved unique platform-wide at creation; seeds Ticket.ticket_number only.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid, description: User (organization member) who created the event. }
        updated_by: { type: string, format: uuid, description: User who last modified the event. }

    EventCreate:
      type: object
      required: [title, start_at, end_at, timezone]
      properties:
        title: { type: string }
        description: { type: string }
        category: { type: string }
        venue_id: { type: string, format: uuid }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        timezone: { type: string }
        images:
          type: array
          items: { type: string, format: uri }

    EventUpdate:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        category: { type: string }
        images:
          type: array
          items: { type: string, format: uri }

    EventList:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Event" }
        pagination: { $ref: "#/components/schemas/Pagination" }

    Pagination:
      type: object
      properties:
        next_cursor: { type: [string, "null"] }
        limit: { type: integer }

    SeatMap:
      type: object
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        seats:
          type: array
          items: { $ref: "#/components/schemas/Seat" }
        created_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string, format: uuid }

    Seat:
      type: object
      properties:
        id: { type: string, format: uuid }
        section: { type: string }
        row: { type: string }
        seat_number: { type: string }
        status: { type: string, enum: [available, held, sold] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TicketType:
      type: object
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [general_admission, reserved_seating] }
        price: { $ref: "#/components/schemas/Money" }
        quantity_total: { type: integer }
        quantity_available: { type: integer }
        sale_start_at: { type: string, format: date-time }
        sale_end_at: { type: string, format: date-time }
        max_per_order: { type: integer }
        sales_paused: { type: boolean, description: "While true the type can not be added to a cart and a cart holding it can not check out. Set with PUT /ticket-types/{id}/sales-status." }
        position: { type: integer, minimum: 0, description: "Where it sits in the event's list (0 = first), as arranged by the organizer. The list endpoint returns ticket types in this order; new ones go to the end. Set with PUT /events/{id}/ticket-types/order." }
        created_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string, format: uuid }

    TicketTypeCreate:
      type: object
      required: [name, kind, price]
      properties:
        name: { type: string }
        kind: { type: string, enum: [general_admission, reserved_seating] }
        price: { $ref: "#/components/schemas/Money" }
        quantity_total: { type: integer }
        sale_start_at: { type: string, format: date-time, description: "Optional; omit to start sales now (server time). A past time is accepted." }
        sale_end_at: { type: string, format: date-time, description: "Must be at least 1 hour after sale_start_at and at least 1 hour before the event starts." }
        max_per_order: { type: integer, default: 10 }

    TicketTypeSalesStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ACTIVE, PAUSED] }

    TicketTypeOrder:
      type: object
      required: [ticket_type_ids]
      properties:
        ticket_type_ids:
          type: array
          minItems: 1
          description: Every ticket type of the event exactly once, in the wanted order.
          items: { type: string, format: uuid }

    TicketTypeUpdate:
      type: object
      properties:
        name: { type: string }
        price: { $ref: "#/components/schemas/Money" }
        quantity_total: { type: integer }
        sale_start_at: { type: string, format: date-time }
        sale_end_at: { type: string, format: date-time }
        max_per_order: { type: integer }
        sales_paused: { type: boolean, description: "true pauses sales, false resumes; omit to leave unchanged." }

    PromoCode:
      type: object
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        code: { type: string }
        discount_type: { type: string, enum: [percentage, fixed] }
        discount_value:
          type: number
          description: A percentage (0-100) if discount_type is percentage, otherwise a fixed Money amount in minor units.
        applicable_ticket_type_ids:
          type: array
          items: { type: string, format: uuid }
        usage_limit_total: { type: [integer, "null"] }
        usage_limit_per_buyer: { type: [integer, "null"] }
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        paused: { type: boolean, description: "While true the code can't be applied or checked out with. Set with PUT /promo-codes/{id}/status." }
        used_count: { type: integer, minimum: 0, description: "How many non-cancelled orders used this code for its event; decides whether code / discount type can still change and whether it can be deleted." }
        created_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string, format: uuid }

    PromoCodeUpdate:
      type: object
      description: Every field optional; omitted or null = unchanged.
      properties:
        code: { type: string, maxLength: 50 }
        discount_type: { type: string, enum: [percentage, fixed] }
        discount_value: { type: number, minimum: 0 }
        applicable_ticket_type_ids:
          type: array
          description: "[] = every ticket type of the event."
          items: { type: string, format: uuid }
        usage_limit_total: { type: integer, minimum: 0, description: "0 = no limit." }
        usage_limit_per_buyer: { type: integer, minimum: 0, description: "0 = no limit." }
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }

    PromoCodeStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ACTIVE, PAUSED] }

    PromoCodeCreate:
      type: object
      required: [code, discount_type, discount_value, valid_from, valid_until]
      properties:
        code: { type: string }
        discount_type: { type: string, enum: [percentage, fixed] }
        discount_value: { type: number }
        applicable_ticket_type_ids:
          type: array
          items: { type: string, format: uuid }
        usage_limit_total: { type: integer }
        usage_limit_per_buyer: { type: integer }
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }

    WaitlistEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        ticket_type_id: { type: [string, "null"], format: uuid }
        user_id: { type: string, format: uuid }
        position: { type: integer }
        notified_at: { type: [string, "null"], format: date-time }
        offer_expires_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    ResalePolicy:
      type: object
      properties:
        event_id: { type: string, format: uuid }
        enabled: { type: boolean, default: false }
        price_cap_rule: { type: string, enum: [face_value, face_value_plus_fee, none] }
        fee_amount:
          $ref: "#/components/schemas/Money"
        created_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string, format: uuid }

    ResalePolicyUpdate:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        price_cap_rule: { type: string, enum: [face_value, face_value_plus_fee, none] }
        fee_amount: { $ref: "#/components/schemas/Money" }

    ResaleListing:
      type: object
      properties:
        id: { type: string, format: uuid }
        ticket_id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        seller_id: { type: string, format: uuid }
        asking_price: { $ref: "#/components/schemas/Money" }
        status: { type: string, enum: [active, sold, cancelled, expired] }
        listed_at: { type: string, format: date-time }
        resolved_at: { type: [string, "null"], format: date-time }
        buyer_order_id: { type: [string, "null"], format: uuid }
        updated_at: { type: string, format: date-time, description: Reflects status transitions between listed_at and resolved_at. }

    RefundPolicy:
      type: object
      properties:
        event_id: { type: string, format: uuid }
        rule_type: { type: string, enum: [refundable_until_n_days, no_refunds, custom] }
        days_before_event: { type: [integer, "null"] }
        custom_terms: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string, format: uuid }

    RefundPolicyUpdate:
      type: object
      required: [rule_type]
      properties:
        rule_type: { type: string, enum: [refundable_until_n_days, no_refunds, custom] }
        days_before_event: { type: integer }
        custom_terms: { type: string }

    Payment:
      type: object
      description: A payment-gateway transaction tied to an Order — same shape whether the order's payee is the organizer or a reselling attendee.
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        gateway_ref: { type: string }
        amount: { $ref: "#/components/schemas/Money" }
        status: { type: string, enum: [pending, completed, failed] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, description: Reflects gateway status transitions. }

    Refund:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        amount: { $ref: "#/components/schemas/Money" }
        reason: { type: string }
        initiated_by: { type: string, format: uuid }
        status: { type: string, enum: [pending, completed, failed] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, description: Reflects status transitions. }

    RefundCreate:
      type: object
      required: [reason]
      properties:
        amount:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Omit for a full refund of the order's total.
        reason: { type: string }

    TicketTemplate:
      type: object
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        ticket_type_id: { type: [string, "null"], format: uuid }
        format: { type: string, enum: [physical, digital] }
        branding:
          type: object
          properties:
            logo_url: { type: [string, "null"], format: uri }
            background_image_url: { type: [string, "null"], format: uri }
            primary_color: { type: [string, "null"] }
        code_type: { type: [string, "null"], enum: [QR, BARCODE, NONE, null], description: "Which scannable code the ticket carries. Both encode the same credential; BARCODE is PDF417 (QR is square, barcode 3:1)." }
        code_x: { type: [number, "null"], minimum: 0, maximum: 100, description: "Top-left corner of the (unrotated) code as % of the ticket width." }
        code_y: { type: [number, "null"], minimum: 0, maximum: 100, description: "... as % of the ticket height. Type, x, y and width are given together or not at all; none = default placement (QR bottom-right)." }
        code_width: { type: [number, "null"], minimum: 1, maximum: 100, description: "Width as % of the ticket width; at least 15 for QR, 35 for BARCODE; code_x + code_width must not exceed 100. The renderer keeps the code on the ticket." }
        code_rotation: { type: [integer, "null"], minimum: 0, maximum: 359, description: "Degrees clockwise about the code centre." }
        ticket_width: { type: [integer, "null"], minimum: 100, maximum: 5000, description: "The ticket's own size in px; need not match the background image. Null = 900." }
        ticket_height: { type: [integer, "null"], minimum: 100, maximum: 5000, description: "Null = 380." }
        background_color: { type: [string, "null"], pattern: "^#[0-9A-Fa-f]{6}$", description: "Fill under everything; null = white." }
        background_fit: { type: [string, "null"], enum: [COVER, CONTAIN, STRETCH, CUSTOM, null], description: "How background_image_url fills the ticket. Null = COVER. Only our own /api/v1/uploads/files/ images are drawn; anything else is ignored." }
        background_x: { type: [number, "null"], minimum: -500, maximum: 500, description: "CUSTOM fit only (and then all four are required): the image's rectangle in % of the ticket width/height. May extend past the edges (it is clipped); must be null for any other fit." }
        background_y: { type: [number, "null"], minimum: -500, maximum: 500 }
        background_width: { type: [number, "null"], exclusiveMinimum: 0, maximum: 500 }
        background_height: { type: [number, "null"], exclusiveMinimum: 0, maximum: 500 }
        text_fields:
          type: array
          maxItems: 30
          description: "In drawing order; later fields are drawn on top. The code is always drawn last."
          items: { $ref: "#/components/schemas/TicketTextField" }
        created_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string, format: uuid }

    TicketTemplateCreate:
      type: object
      required: [format]
      properties:
        ticket_type_id: { type: string, format: uuid }
        format: { type: string, enum: [physical, digital] }
        branding:
          type: object
          properties:
            logo_url: { type: string, format: uri }
            background_image_url: { type: string, format: uri }
            primary_color: { type: string }
        code_type: { type: string, enum: [QR, BARCODE, NONE] }
        code_x: { type: number, minimum: 0, maximum: 100 }
        code_y: { type: number, minimum: 0, maximum: 100 }
        code_width: { type: number, minimum: 1, maximum: 100 }
        code_rotation: { type: integer, minimum: 0, maximum: 359 }
        ticket_width: { type: integer, minimum: 100, maximum: 5000 }
        ticket_height: { type: integer, minimum: 100, maximum: 5000 }
        background_color: { type: string, pattern: "^(#[0-9A-Fa-f]{6})?$", description: "#RRGGBB. On update, an empty string clears it (white)." }
        background_fit: { type: string, enum: [COVER, CONTAIN, STRETCH, CUSTOM], description: "CUSTOM needs all four background_* values; any other fit must not send them. On update, switching to a non-CUSTOM fit drops the stored rectangle." }
        background_x: { type: number, minimum: -500, maximum: 500 }
        background_y: { type: number, minimum: -500, maximum: 500 }
        background_width: { type: number, exclusiveMinimum: 0, maximum: 500 }
        background_height: { type: number, exclusiveMinimum: 0, maximum: 500 }
        text_fields:
          type: array
          maxItems: 30
          items: { $ref: "#/components/schemas/TicketTextField" }

    TicketTemplateUpdate:
      type: object
      properties:
        branding:
          type: object
          properties:
            logo_url: { type: string, format: uri }
            background_image_url: { type: string, format: uri }
            primary_color: { type: string }
        code_type: { type: string, enum: [QR, BARCODE, NONE], description: "Same rules as on create; any value given is merged with the stored placement and the result is re-validated. There is no way to clear a placement yet. background_image_url `\"\"` clears the background." }
        code_x: { type: number, minimum: 0, maximum: 100 }
        code_y: { type: number, minimum: 0, maximum: 100 }
        code_width: { type: number, minimum: 1, maximum: 100 }
        code_rotation: { type: integer, minimum: 0, maximum: 359 }
        ticket_width: { type: integer, minimum: 100, maximum: 5000 }
        ticket_height: { type: integer, minimum: 100, maximum: 5000 }
        background_color: { type: string, pattern: "^(#[0-9A-Fa-f]{6})?$", description: "#RRGGBB. On update, an empty string clears it (white)." }
        background_fit: { type: string, enum: [COVER, CONTAIN, STRETCH, CUSTOM], description: "CUSTOM needs all four background_* values; any other fit must not send them. On update, switching to a non-CUSTOM fit drops the stored rectangle." }
        background_x: { type: number, minimum: -500, maximum: 500 }
        background_y: { type: number, minimum: -500, maximum: 500 }
        background_width: { type: number, exclusiveMinimum: 0, maximum: 500 }
        background_height: { type: number, exclusiveMinimum: 0, maximum: 500 }
        text_fields:
          type: array
          maxItems: 30
          description: "On update: omitted = unchanged, [] = remove all, otherwise the whole list is replaced."
          items: { $ref: "#/components/schemas/TicketTextField" }

    TicketTextField:
      type: object
      required: [key, x, y, font_size, color, align]
      description: |
        One text printed on the ticket. x is the anchor edge chosen by align (left edge, centre or right edge of the text),
        y the vertical centre of the whole text block, both in % of the ticket's width/height. Which members apply depends
        on key: per-ticket keys (TICKET_TYPE, SECTION, ROW, SEAT, TICKET_NUMBER, ATTENDEE_NAME) may have sample_length /
        sample_text and no line_breaks; event keys (EVENT_NAME, EVENT_DATE, EVENT_TIME, VENUE) and CUSTOM may have
        line_breaks. CUSTOM needs text and no other key may have it. Every key except CUSTOM appears at most once (CUSTOM up to 10 times).
        Values: SECTION is "GA" and ROW/SEAT "-" for general admission; ATTENDEE_NAME is the ticket's current owner;
        EVENT_DATE ("Wed, Dec 23, 2026") and EVENT_TIME ("8:30 PM") are in the event's own time zone.
        In responses, members that do not apply to a field are omitted (never null); rotation (0 when unrotated) and bold are always present.
      properties:
        key: { type: string, enum: [TICKET_TYPE, SECTION, ROW, SEAT, TICKET_NUMBER, ATTENDEE_NAME, EVENT_NAME, EVENT_DATE, EVENT_TIME, VENUE, CUSTOM] }
        x: { type: number, minimum: 0, maximum: 100 }
        y: { type: number, minimum: 0, maximum: 100 }
        font_size: { type: number, minimum: 2, maximum: 25, description: "% of the ticket height; line height is 1.15 x." }
        color: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        bold: { type: boolean, default: false }
        align: { type: string, enum: [LEFT, CENTER, RIGHT] }
        rotation: { type: integer, minimum: 0, maximum: 359, default: 0, description: "Degrees clockwise about the centre of the text's box." }
        sample_length: { type: integer, minimum: 1, maximum: 30, description: "Per-ticket keys only: reserved width in 'X' characters when there is no sample_text. The value fills the reserved box from its aligned edge and is never truncated." }
        sample_text: { type: string, minLength: 1, maxLength: 30, description: "Per-ticket keys only: single line (trimmed); its width is the reserved width." }
        text: { type: string, minLength: 1, maxLength: 60, description: "CUSTOM only: single line (trimmed)." }
        line_breaks:
          type: array
          maxItems: 10
          description: "Event keys and CUSTOM only: ascending unique character positions (> 0) where a new line starts; for CUSTOM each must be less than the text length."
          items: { type: integer, minimum: 1 }

    Cart:
      type: object
      properties:
        id: { type: string, format: uuid }
        buyer_id: { type: string, format: uuid }
        items:
          type: array
          items: { $ref: "#/components/schemas/CartItem" }
        applied_promo_code:
          type: [object, "null"]
          properties:
            code: { type: string }
            discount_amount: { $ref: "#/components/schemas/Money" }
        platform_fee:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: The platform fee that will be added on top of the ticket price (the percentage on the total after the promo discount plus the rule's fixed amount for every ticket; 0 when no fee rule applies or when the organizer or the platform bears it).
        gateway_fee:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: The payment gateway fee the buyer pays on top (0 unless management made the customer bear it, see /payment-gateway-fee). Shown as `gatewayFee` in the JSON.
        total:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: What the buyer will pay - ticket price minus any promo discount, plus platform_fee and gateway_fee.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CartItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        ticket_type_id: { type: string, format: uuid }
        seat_id: { type: [string, "null"], format: uuid }
        quantity: { type: integer }
        hold_expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        buyer_id: { type: string, format: uuid }
        payee_type: { type: string, enum: [organization, user] }
        payee_id: { type: string, format: uuid }
        status: { type: string, enum: [pending, paid, cancelled, refunded, partially_refunded] }
        promo_code: { type: [string, "null"] }
        platform_fee:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: The platform fee charged on top of the ticket price (already part of total; 0 when no fee rule applied or when the organizer or the platform bore it). Fixed when the order was placed - later rule changes do not alter it.
        gateway_fee:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: The payment gateway fee the buyer paid on top (already part of total; 0 unless the customer bore it). Fixed when the order was placed. Shown as `gatewayFee` in the JSON.
        total:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: What the buyer paid, platform_fee and gateway_fee included.
        tickets:
          type: array
          items: { $ref: "#/components/schemas/Ticket" }
        created_at: { type: string, format: date-time }
        created_by:
          type: string
          format: uuid
          description: User who initiated the purchase — normally equal to buyer_id, but may differ for an organizer/admin-initiated order (e.g. a comp ticket) placed on a buyer's behalf.
        updated_at: { type: string, format: date-time, description: "Reflects status transitions (pending -> paid -> refunded, etc)." }

    OrderList:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Order" }
        pagination: { $ref: "#/components/schemas/Pagination" }

    Ticket:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        ticket_type_id: { type: string, format: uuid }
        seat_id: { type: [string, "null"], format: uuid }
        owner_id: { type: string, format: uuid }
        ticket_number:
          type: string
          description: "Human-visible PREFIX-XXXXXX, e.g. K3F-A1B2C3. Not a check-in credential."
        status: { type: string, enum: [valid, used, transferred, refunded, cancelled] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, description: Reflects status transitions. }

    TicketTransfer:
      type: object
      properties:
        id: { type: string, format: uuid }
        ticket_id: { type: string, format: uuid }
        from_user_id: { type: string, format: uuid }
        to_user_id: { type: string, format: uuid }
        source: { type: string, enum: [direct_transfer, resale] }
        transferred_at: { type: string, format: date-time }

    TicketDataset:
      type: object
      description: Full pre-fetched ticket state for offline validation.
      properties:
        event_id: { type: string, format: uuid }
        generated_at: { type: string, format: date-time }
        tickets:
          type: array
          items:
            type: object
            properties:
              ticket_id: { type: string, format: uuid }
              credential_hash: { type: string, description: For local signature/lookup verification without exposing the raw credential unnecessarily. }
              status: { type: string, enum: [valid, used, transferred, refunded, cancelled] }

    ValidationResult:
      type: object
      properties:
        ticket_id: { type: [string, "null"], format: uuid }
        result: { type: string, enum: [valid, duplicate, invalid, wrong_event] }
        scanned_at: { type: string, format: date-time }
        ticket_summary:
          type: [object, "null"]
          properties:
            ticket_number: { type: string }
            ticket_type_name: { type: string }
            seat: { type: [string, "null"] }

    CheckInConfig:
      type: object
      properties:
        event_id: { type: string, format: uuid }
        mode: { type: string, enum: [standard, pure_offline] }
        offline_fallback_expiry_seconds: { type: integer, default: 300 }
        warning:
          type: [string, "null"]
          description: Set when a mode switch occurs while a device may hold unsynced scans.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string, format: uuid, description: Organizer who last changed the mode/config. }

    ScannerDeviceWithCredential:
      type: object
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        device_label: { type: string }
        status: { type: string, enum: [active, revoked] }
        credential:
          type: string
          description: Shown once, at creation, and never again.
        created_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid, description: Organizer who authorized this device. }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string, format: uuid }

    CheckInRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        ticket_id: { type: string, format: uuid }
        source_type: { type: string, enum: [scanner_device, reconciled_fallback] }
        source_id: { type: string, format: uuid }
        scanned_at: { type: string, format: date-time }
        result: { type: string, enum: [valid, duplicate, invalid, wrong_event] }

    GatewayFeeSettingRequest:
      type: object
      required: [percentage, payer]
      properties:
        percentage: { type: number, minimum: 0, maximum: 100, multipleOf: 0.001, description: "Percent of the purchase total before this fee, up to three decimals (PayMongo's card rate is 3.125). 0 = none." }
        flatAmount:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: "The fixed part of the fee per order, in minor units (PHP 13.39 is amount 1339); skipped for an order in another currency. Left out means none."
        payer: { type: string, enum: [CUSTOMER, ORGANIZATION] }
        foreignPercentage: { type: number, minimum: 0, maximum: 100, multipleOf: 0.001, description: "The whole percentage for a card issued abroad (4.5 for PayMongo). Leave out with foreignFlatAmount: a foreign card costs the domestic rate." }
        foreignFlatAmount:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: "The fixed part for a card issued abroad; must be in the same currency as flatAmount."

    GatewayFeeSetting:
      type: object
      properties:
        percentage: { type: number, description: The domestic percentage. }
        flatAmount: { $ref: "#/components/schemas/Money" }
        payer: { type: string, enum: [CUSTOMER, ORGANIZATION] }
        foreignPercentage: { type: [number, "null"], description: "The percentage for a card issued abroad; null when it costs the domestic rate." }
        foreignFlatAmount:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        updatedAt: { type: [string, "null"], format: date-time }

    CheckoutStart:
      type: object
      description: "A checkout waiting for the payment provider (PayMongo). `clientKey` is a secret for this one payment, do not log it."
      properties:
        checkoutId: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, PAID, FAILED, REFUNDED] }
        clientKey: { type: string, description: Attach the card to the payment intent with this (PayMongo.js). }
        amount: { type: integer, description: "Total in centavos, platform fee included." }
        currency: { type: string, example: PHP }
        orderId: { type: [string, "null"], format: uuid, description: Set once PAID. }
        failureReason: { type: [string, "null"] }
        nextAction:
          type: [string, "null"]
          enum: [NONE, REDIRECT, null]
          description: "Only when a saved card was paid with from the server. NONE = nothing more to do, the webhook completes the order. REDIRECT = send the buyer to `redirectUrl` (the bank's 3-D Secure page); they come back to the `returnUrl` sent. Null for a card typed in the browser."
        redirectUrl: { type: [string, "null"], description: "The bank's 3-D Secure page when nextAction is REDIRECT." }
        cardSaving:
          type: string
          enum: [REQUESTED, UNAVAILABLE, NOT_REQUESTED]
          description: "What became of `saveCard`. REQUESTED = the card will be saved once the payment succeeds. UNAVAILABLE = it was asked for but PayMongo cannot vault cards on this account (or the customer could not be created): the payment still goes ahead, show \"Your card could not be saved\". NOT_REQUESTED = saveCard was not sent."

    PaymentMethod:
      type: object
      description: A saved card as shown. The provider's id and any token are never returned.
      properties:
        id: { type: string, format: uuid }
        holderName: { type: string }
        brand: { type: string, example: visa }
        last4: { type: string, example: "4242" }
        expMonth: { type: integer }
        expYear: { type: integer }
        primary: { type: boolean }
        canChargeAgain:
          type: boolean
          description: "False = this card cannot be paid with again without typing it (with PayMongo: it was saved before the provider's payment method was kept, or saved without a payment). Checkout with it is a 409 \"Re-enter this card to use it again\"."

    PaymentMethodRequest:
      type: object
      required: [paymentToken]
      description: There is no field for a card number or security code.
      properties:
        paymentToken: { type: string, pattern: "^(pm|tok)_[A-Za-z0-9_]{2,100}$", description: A Stripe pm_ id (Stripe gateway) or tok_<brand> (mock gateway). }
        primary: { type: boolean, description: "Ignored for the first card, which is always primary." }
        holderName: { type: string, maxLength: 100, description: "Letters, spaces and . , ' - only; no HTML. Defaults to the account name." }
        brand: { type: string, maxLength: 30, description: "Mock gateway only. Defaults to the token's brand." }
        last4: { type: string, pattern: "^[0-9]{4}$", description: "Mock gateway only (ignored with Stripe)." }
        expMonth: { type: integer, minimum: 1, maximum: 12, description: "Mock gateway only." }
        expYear: { type: integer, description: "Mock gateway only. The card must not have expired." }

    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [order_confirmation, payment_receipt, event_reminder, event_change, event_cancellation, waitlist_availability, refund_confirmation]
        channel: { type: string, enum: [email, sms, push] }
        related_object_type: { type: [string, "null"] }
        related_object_id: { type: [string, "null"], format: uuid }
        sent_at: { type: [string, "null"], format: date-time }
        status: { type: string, enum: [pending, sent, failed] }
        created_at: { type: string, format: date-time, description: When the notification was triggered (distinct from sent_at). }

    Dispute:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_id: { type: [string, "null"], format: uuid }
        ticket_id: { type: [string, "null"], format: uuid }
        raised_by: { type: string, format: uuid }
        status: { type: string, enum: [open, investigating, resolved, dismissed] }
        resolution: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, description: Reflects status/resolution changes. }
        updated_by: { type: string, format: uuid, description: Admin who last acted on it. }

    DisputeCreate:
      type: object
      required: [reason]
      properties:
        order_id: { type: string, format: uuid }
        ticket_id: { type: string, format: uuid }
        reason: { type: string }

    DisputeUpdate:
      type: object
      properties:
        status: { type: string, enum: [open, investigating, resolved, dismissed] }
        resolution: { type: string }

    ModerationAction:
      type: object
      description: >
        BR-ADMIN-002. Original design (not in the ERD/business-rules docs) -
        confirmed and added in Phase 12. Append-only: a row is never edited
        after creation, mirroring AuditLogEntry's own "a mutable audit trail
        would defeat its own purpose" philosophy.
      properties:
        id: { type: string, format: uuid }
        target_type: { type: string, enum: [organization, event, user] }
        target_id: { type: string, format: uuid }
        action: { type: string, enum: [suspend, reinstate, remove] }
        reason: { type: string }
        previous_status:
          type: [string, "null"]
          description: >
            The target's status/state immediately before this action, so a
            later REINSTATE knows exactly what to restore. Free-form string
            since Organization/Event/User each have their own distinct
            status enum.
        performed_by: { type: string, format: uuid, description: The admin who took this action. }
        created_at: { type: string, format: date-time }

    ModerationActionCreate:
      type: object
      required: [target_type, target_id, action, reason]
      properties:
        target_type: { type: string, enum: [organization, event, user] }
        target_id: { type: string, format: uuid }
        action: { type: string, enum: [suspend, reinstate, remove] }
        reason: { type: string }

    AuditLogEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        actorId:
          type: [string, "null"]
          format: uuid
          description: Null when the system acted on its own (e.g. event.completed).
        actorName:
          type: [string, "null"]
          description: Only on GET /events/{eventId}/activity; null for the system or a user that no longer exists.
        action: { type: string, example: refund.issued }
        targetType: { type: [string, "null"] }
        targetId: { type: [string, "null"], format: uuid }
        eventId:
          type: [string, "null"]
          format: uuid
          description: The event the entry belongs to (BR-EVENT-006), when it is about an event or something of it.
        details:
          type: [object, "null"]
          description: >
            What happened, when there is more to say (BR-EVENT-006; null on older entries). `*.updated`: only the
            fields that changed, by their API name - `{"changes": [{"field": "title", "from": "Event Sample", "to":
            "Event Sample 2026"}]}`; Money is `{amount, currency}`, dates ISO strings, lists (images, ...) their count,
            text capped at 500 characters. `*.created` / `*.deleted`, sales paused/resumed, promo code paused/resumed,
            scanner devices: `{"name": ...}` (so a deleted item can still be named); `ticket_type.reordered` also
            `"order"` (names, first to last); `refund.issued`: `{orderId, amount, reason}`; event moderation:
            `{"reason"}` when one was given. Never secrets, card data or buyers' personal data.
          additionalProperties: true
          example: { changes: [ { field: title, from: Event Sample, to: Event Sample 2026 } ] }
        createdAt: { type: string, format: date-time }

    Payout:
      type: object
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        gross: { $ref: "#/components/schemas/Money" }
        fees:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: The platform fees of the settled orders, deducted from the gross.
        net:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: gross - fees - what the organizer is owed.
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        status: { type: string, enum: [scheduled, processing, paid, failed, cancelled], description: "processing = the transfer is with PayMongo and has not settled yet. cancelled = cancelled by an admin while scheduled; its orders were released (final)." }
        payoutCardId: { type: [string, "null"], format: uuid, description: The primary payout card this payout was made out to (null on older payouts and with PayMongo). }
        payoutAccountId: { type: [string, "null"], format: uuid, description: The bank or e-wallet account it was made out to (PayMongo). }
        eventId: { type: [string, "null"], format: uuid, description: "The event this payout settles (a batch payout line); null for a period payout." }
        eventTitle: { type: [string, "null"], description: The title of that event. }
        transferId: { type: [string, "null"], description: PayMongo's id for the transfer (tr_...); null until it is sent. }
        failureReason: { type: [string, "null"], description: Why the last send failed. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, description: Reflects status transitions. }

    GatewayFeeCheck:
      type: object
      properties:
        provider: { type: string, enum: [PAYMONGO, MOCK] }
        configured:
          type: object
          description: The fee setting as it is now.
          properties:
            percentage: { type: number }
            flatAmount: { $ref: "#/components/schemas/Money" }
            payer: { type: string, enum: [CUSTOMER, ORGANIZATION] }
            foreignPercentage: { type: [number, "null"] }
            foreignFlatAmount: { oneOf: [ { $ref: "#/components/schemas/Money" }, { type: "null" } ] }
        samples:
          type: array
          description: The latest paid payments, newest first.
          items:
            type: object
            properties:
              paymentId: { type: string }
              amount: { $ref: "#/components/schemas/Money" }
              fee: { allOf: [ { $ref: "#/components/schemas/Money" } ], description: "The gateway's base fee." }
              foreignFee: { allOf: [ { $ref: "#/components/schemas/Money" } ], description: "Surcharge for a card issued abroad; 0 otherwise." }
              totalFee: { allOf: [ { $ref: "#/components/schemas/Money" } ], description: fee + foreignFee. }
              netAmount: { allOf: [ { $ref: "#/components/schemas/Money" } ], description: "What PayMongo left after the fees." }
              effectivePercent: { type: number, description: "totalFee as a percent of the amount." }
              sourceType: { type: [string, "null"] }
              cardBrand: { type: [string, "null"] }
              cardCountry: { type: [string, "null"] }
              cardOrigin: { type: [string, "null"], enum: [DOMESTIC, FOREIGN, null], description: "DOMESTIC for a card issued in the Philippines, FOREIGN for any other country; decides which configured rate the payment is compared with." }
              paidAt: { type: [string, "null"], format: date-time }
              livemode: { type: boolean }
              matchedRate: { type: [string, "null"], enum: [DOMESTIC_CARD, INTERNATIONAL_CARD, null] }
              expectedWithConfigured: { allOf: [ { $ref: "#/components/schemas/Money" } ], description: What the current setting would have charged on this amount. }
              differenceFromConfigured: { allOf: [ { $ref: "#/components/schemas/Money" } ], description: "totalFee minus expectedWithConfigured: negative means the setting charges more than PayMongo took." }
              matchesConfigured: { type: boolean, description: "Within one centavo of the setting." }
        allSamplesMatchConfigured: { type: boolean }
        suggestedSetting:
          type: [object, "null"]
          properties:
            basedOn: { type: string }
            percentage: { type: number }
            flatAmount: { $ref: "#/components/schemas/Money" }
        note: { type: [string, "null"], description: "Why there are no samples (mock mode, or no paid payments yet)." }

    PayoutWallet:
      type: object
      properties:
        provider: { type: string, enum: [PAYMONGO, MOCK] }
        id: { type: string, example: wallet_xxxxxxxx }
        status: { type: string, enum: [activated, deactivated], description: "PayMongo's own status. A new wallet is deactivated until the Statement of Acceptance is signed in the Dashboard; it also goes deactivated when locked." }
        activated: { type: boolean, description: "True when status is activated: the wallet can send and receive." }
        livemode: { type: boolean, description: "False for a test wallet." }
        isDefault: { type: boolean }
        type: { type: string, description: "basic or fully_verified: decides the limits." }
        statementOfAcceptanceSignedAt: { type: [string, "null"], format: date-time }
        balance:
          type: object
          properties:
            available: { $ref: "#/components/schemas/Money" }
            pending: { $ref: "#/components/schemas/Money" }
        limits:
          type: object
          description: "999999999999999999 means no limit."
          properties:
            balance: { $ref: "#/components/schemas/Money" }
            inwardDaily: { $ref: "#/components/schemas/Money" }
            inwardMonthly: { $ref: "#/components/schemas/Money" }
            outwardDaily: { $ref: "#/components/schemas/Money" }
            outwardMonthly: { $ref: "#/components/schemas/Money" }
        usage:
          type: object
          description: How much has moved through the wallet so far today and this month.
          properties:
            inwardDaily: { $ref: "#/components/schemas/Money" }
            inwardMonthly: { $ref: "#/components/schemas/Money" }
            outwardDaily: { $ref: "#/components/schemas/Money" }
            outwardMonthly: { $ref: "#/components/schemas/Money" }
        account:
          type: object
          description: "The wallet's own account: what a top-up is sent to."
          properties:
            provider: { type: string }
            accountName: { type: string }
            accountNumber: { type: string }
            currency: { type: string }
        createdAt: { type: [string, "null"], format: date-time }
        updatedAt: { type: [string, "null"], format: date-time }
        matchesConfiguredAccount: { type: [boolean, "null"], description: "Whether the wallet is the one in PAYMONGO_WALLET_ACCOUNT_NUMBER." }

    EligiblePayouts:
      type: object
      properties:
        summary:
          type: object
          properties:
            eligibleOrganizations: { type: integer, description: Organizations with a READY line. }
            eligibleAmount: { $ref: "#/components/schemas/Money" }
            onHold: { $ref: "#/components/schemas/Money" }
        items:
          type: array
          items:
            type: object
            properties:
              organizationId: { type: string, format: uuid }
              organizationName: { type: string }
              eventId: { type: string, format: uuid }
              eventTitle: { type: string }
              eligible: { allOf: [ { $ref: "#/components/schemas/Money" } ], description: The net a payout of this line would pay. }
              status: { type: string, enum: [READY, ON_HOLD] }
              holdReason: { type: [string, "null"], description: "Pending refunds, or More than one currency." }

    PayoutBatchRequest:
      type: object
      required: [periodStart, periodEnd, items]
      properties:
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date, description: Not in the future. }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [organizationId, eventId]
            properties:
              organizationId: { type: string, format: uuid }
              eventId: { type: string, format: uuid }

    PayoutAccountRequest:
      type: object
      required: [bankCode, bankName, accountName, accountNumber]
      properties:
        bankCode: { type: string, pattern: "^[A-Z0-9]{8,11}$", description: The bank's code from GET /payout-banks. }
        bankName: { type: string, maxLength: 100 }
        accountName: { type: string, maxLength: 150, description: Must match the name the bank has on the account. }
        accountNumber: { type: string, pattern: "^[0-9]{5,20}$", description: Never returned; stored encrypted. }

    PayoutAccount:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        bankName: { type: string }
        bankCode: { type: string }
        accountName: { type: string }
        accountNumberLast4: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, "null"], format: date-time }

    PayoutCardRequest:
      type: object
      required: [holderName, brand, last4, expMonth, expYear, paymentToken]
      description: What the payment gateway returned for the card. There is no field for the full number or the security code.
      properties:
        holderName: { type: string, maxLength: 100, description: "Letters, spaces and . , ' - only; no HTML." }
        brand: { type: string, maxLength: 30, example: Visa }
        last4: { type: string, pattern: "^[0-9]{4}$" }
        expMonth: { type: integer, minimum: 1, maximum: 12 }
        expYear: { type: integer, minimum: 2000, maximum: 2200, description: The card must not have expired (valid through the end of its expiry month). }
        paymentToken: { type: string, pattern: "^[A-Za-z0-9_.-]{8,255}$", description: The gateway token. A bare 12 to 19 digit number is refused as a card number. }
        primary: { type: boolean, description: "Ignored for the first card, which is always primary." }

    PayoutCard:
      type: object
      description: A payout card as shown. The gateway token is never returned.
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        holderName: { type: string }
        brand: { type: string }
        last4: { type: string, example: "4242" }
        expMonth: { type: integer }
        expYear: { type: integer }
        primary: { type: boolean }
        createdAt: { type: string, format: date-time }

    PayoutGenerate:
      type: object
      required: [periodStart, periodEnd]
      properties:
        periodStart: { type: string, format: date, description: First day (UTC) of the orders to settle. }
        periodEnd: { type: string, format: date, description: "Last day (UTC), included; not in the future and not before periodStart." }

    PlatformFeeRuleRequest:
      type: object
      description: "Send `percentage`, `flatAmount` or both (the fee is then the percentage on the ticket total plus the flat amount for each ticket); at least one is required. `payer` says who bears the fee."
      properties:
        type: { type: string, enum: [PERCENTAGE, FLAT, COMBINED], description: "Ignored: the kind of rule follows from which numbers are sent. Kept so older callers still work." }
        percentage: { type: number, minimum: 0, maximum: 100, multipleOf: 0.01, description: "Percent of the ticket total after promo discounts, rounded half up to the minor unit. 0 = no fee." }
        flatAmount:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: A fixed fee per TICKET (an order of 3 tickets pays it 3 times). A flat amount in another currency than the order is skipped (no flat part).
        payer:
          type: string
          enum: [CUSTOMER, ORGANIZATION]
          description: "Who bears the fee, default CUSTOMER. CUSTOMER: added on top of the ticket price. ORGANIZATION: the buyer pays nothing extra and the fee is deducted from the organizer's payout. PLATFORM is refused with 400."

    PlatformFeeRule:
      type: object
      properties:
        id: { type: string, format: uuid }
        scope: { type: string, enum: [PLATFORM, ORGANIZATION, EVENT], description: "The most specific scope wins: EVENT, then ORGANIZATION, then PLATFORM." }
        scopeId: { type: [string, "null"], format: uuid, description: "The organization or event id; null for the platform default." }
        type: { type: string, enum: [PERCENTAGE, FLAT, COMBINED], description: "COMBINED = a percentage plus a flat amount per ticket." }
        percentage: { type: [number, "null"] }
        flatAmount:
          description: The fixed part, charged for each ticket.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        payer: { type: string, enum: [CUSTOMER, ORGANIZATION] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, "null"], format: date-time }

    EffectivePlatformFee:
      type: object
      properties:
        eventId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        rule:
          oneOf:
            - $ref: "#/components/schemas/PlatformFeeRule"
            - type: "null"
          description: The rule that applies to the event; null when none does (no fee).

    EventAnalytics:
      type: object
      properties:
        event_id: { type: string, format: uuid }
        tickets_sold: { type: integer }
        revenue:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Ticket revenue - what the buyers paid, without the platform fee.
        remaining_inventory: { type: integer }
        sales_over_time:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              tickets_sold: { type: integer }
              revenue: { $ref: "#/components/schemas/Money" }

    EventAudience:
      type: object
      properties:
        eventId: { type: string, format: uuid }
        buyers: { type: integer, description: "Distinct buyers with a PAID or PARTIALLY_REFUNDED order for the event." }
        unknownAge: { type: integer, description: "Buyers without a birth date." }
        ageGroups:
          type: array
          description: Always the six groups, in this order.
          items:
            type: object
            properties:
              label: { type: string, enum: ["Under 18", "18-24", "25-34", "35-44", "45-54", "55+"] }
              buyers: { type: [integer, "null"], description: "null when the group is hidden (fewer than 5 buyers)." }
              tickets: { type: [integer, "null"], description: "The group's live tickets; null when the group is hidden." }

    EventFunnel:
      type: object
      properties:
        eventId: { type: string, format: uuid }
        timezone: { type: string, example: Asia/Manila }
        from: { type: string, format: date }
        to: { type: string, format: date }
        views: { type: integer }
        uniqueVisitors: { type: integer }
        addToCart:
          type: object
          properties:
            actions: { type: integer, description: "ADD entries: a line added or its quantity raised." }
            quantity: { type: integer, description: Tickets added. }
            uniqueBuyers: { type: integer }
        checkedOut:
          type: object
          properties:
            quantity: { type: integer }
            uniqueBuyers: { type: integer }
        viewToCartRate: { type: [number, "null"] }
        viewToPurchaseRate: { type: [number, "null"] }
        daily:
          type: array
          items:
            type: object
            properties:
              day: { type: string, format: date }
              views: { type: integer }
              uniqueVisitors: { type: integer }
              addToCartQuantity: { type: integer }
              checkedOutQuantity: { type: integer }
        ticketTypes:
          type: array
          items:
            type: object
            properties:
              ticketTypeId: { type: string, format: uuid }
              name: { type: string }
              addToCartActions: { type: integer }
              addedQuantity: { type: integer }
              uniqueBuyersAdding: { type: integer }
              checkedOutQuantity: { type: integer }
              removedQuantity: { type: integer }
              expiredQuantity: { type: integer }
              cartConversionRate: { type: [number, "null"], description: "checkedOutQuantity / addedQuantity; null when nothing was added." }
        trackingSince: { type: [string, "null"], format: date-time, description: "When the logs started on this server." }

    EventSalesPatterns:
      type: object
      properties:
        eventId: { type: string, format: uuid }
        timezone: { type: string, example: Asia/Manila }
        tickets: { type: integer, description: Live tickets sold. }
        orders: { type: integer }
        promoOrders: { type: integer, description: Orders placed with a promo code. }
        daily:
          type: array
          items:
            type: object
            properties:
              day: { type: string, format: date }
              tickets: { type: integer }
        byWeekday: { type: array, items: { type: integer }, minItems: 7, maxItems: 7, description: "Tickets per weekday, Monday first." }
        byHour: { type: array, items: { type: integer }, minItems: 24, maxItems: 24, description: "Tickets per hour of the day, 0 to 23." }

    FinancePayoutTotal:
      type: object
      properties:
        count: { type: integer }
        net: { $ref: "#/components/schemas/Money" }

    FinancePayouts:
      type: object
      description: The payouts created in the period, by status.
      properties:
        scheduled: { $ref: "#/components/schemas/FinancePayoutTotal" }
        processing: { $ref: "#/components/schemas/FinancePayoutTotal" }
        paid: { $ref: "#/components/schemas/FinancePayoutTotal" }
        failed: { $ref: "#/components/schemas/FinancePayoutTotal" }

    FinanceSummary:
      type: object
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        currency: { type: string }
        otherCurrencies: { type: array, items: { type: string }, description: "Other currencies with orders in the period, left out of every figure." }
        orders:
          type: object
          properties:
            count: { type: integer }
            refunded: { type: integer, description: Orders with at least one completed refund. }
        sales:
          type: object
          properties:
            gross: { allOf: [ { $ref: "#/components/schemas/Money" } ], description: "What buyers paid, fees added on top included." }
            refunds: { $ref: "#/components/schemas/Money" }
            net: { allOf: [ { $ref: "#/components/schemas/Money" } ], description: gross - refunds. }
        platform:
          type: object
          properties:
            feeIncome: { allOf: [ { $ref: "#/components/schemas/Money" } ], description: "Platform fee kept." }
            gatewayCostBorne: { allOf: [ { $ref: "#/components/schemas/Money" } ], description: "Gateway fee the platform itself pays." }
            netIncome: { allOf: [ { $ref: "#/components/schemas/Money" } ], description: feeIncome - gatewayCostBorne. }
        gatewayFees:
          type: object
          properties:
            charged: { allOf: [ { $ref: "#/components/schemas/Money" } ], description: "What the gateway really kept in all, read from its own payment records (PayMongo's fee plus any foreign-card fee). An order whose fee is not known yet counts 0 (see unknownFeeOrders)." }
            paidByCustomer: { $ref: "#/components/schemas/Money" }
            borneByOrganization: { $ref: "#/components/schemas/Money" }
            borneByPlatform: { allOf: [ { $ref: "#/components/schemas/Money" } ], description: "What the gateway kept that nobody else covered: the whole fee when the platform is the payer or no payer was recorded, and negative when customers were charged more than the gateway kept." }
            foreignCardOrders: { type: integer }
            unknownFeeOrders: { type: integer, description: "Orders with no fee information at all (placed before gateway fees were recorded, and not found in PayMongo's latest 100 payments yet); counted as 0 in charged." }
        organizers:
          type: object
          properties:
            share: { allOf: [ { $ref: "#/components/schemas/Money" } ], description: "What the organizations are owed in all (the net their payouts pay)." }
            paidOut: { $ref: "#/components/schemas/Money" }
            inPayouts: { $ref: "#/components/schemas/Money" }
            owedNotYetInPayout: { $ref: "#/components/schemas/Money" }
        payouts: { $ref: "#/components/schemas/FinancePayouts" }

    OrganizationFinance:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        eventId: { type: [string, "null"], format: uuid, description: "The event every figure is narrowed to; null for the whole organization." }
        from: { type: string, format: date }
        to: { type: string, format: date }
        currency: { type: string }
        otherCurrencies: { type: array, items: { type: string } }
        orders: { type: integer }
        sales:
          type: object
          properties:
            gross: { $ref: "#/components/schemas/Money" }
            refunds: { $ref: "#/components/schemas/Money" }
            net: { $ref: "#/components/schemas/Money" }
        deductions:
          type: object
          properties:
            platformFee: { $ref: "#/components/schemas/Money" }
            gatewayFee: { $ref: "#/components/schemas/Money" }
            total: { $ref: "#/components/schemas/Money" }
        income: { allOf: [ { $ref: "#/components/schemas/Money" } ], description: "gross - refunds - deductions: the net its payouts pay." }
        paidOut: { $ref: "#/components/schemas/Money" }
        inPayouts: { $ref: "#/components/schemas/Money" }
        owedNotYetInPayout: { $ref: "#/components/schemas/Money" }
        payouts: { $ref: "#/components/schemas/FinancePayouts" }

    OrganizationEarnings:
      type: object
      properties:
        interval: { type: string, enum: [DAY, MONTH] }
        from: { type: string, format: date }
        to: { type: string, format: date }
        currency: { type: string }
        eventId: { type: [string, "null"], format: uuid }
        points:
          type: array
          description: Every day or month of the range, oldest first.
          items:
            type: object
            properties:
              period: { type: string, description: "`2026-10-15` for DAY, `2026-10` for MONTH.", example: "2026-10-15" }
              earnings: { $ref: "#/components/schemas/Money" }

    Transaction:
      type: object
      properties:
        id: { type: string, format: uuid, description: "The order's, refund's or payout's id." }
        type: { type: string, enum: [SALE, REFUND, PAYOUT] }
        occurredAt: { type: string, format: date-time }
        description: { type: string }
        eventTitle: { type: [string, "null"] }
        orderId: { type: [string, "null"], format: uuid }
        gross: { $ref: "#/components/schemas/Money" }
        fees: { $ref: "#/components/schemas/Money" }
        net: { allOf: [ { $ref: "#/components/schemas/Money" } ], description: "Negative for REFUND and PAYOUT." }
        status: { type: string, description: "The order's, refund's or payout's own status." }

    TransactionPage:
      type: object
      properties:
        content:
          type: array
          items: { $ref: "#/components/schemas/Transaction" }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPage: { type: integer }
        last: { type: boolean }

    PlatformAnalytics:
      type: object
      properties:
        total_gmv: { $ref: "#/components/schemas/Money" }
        active_organizers: { type: integer }
        event_volume: { type: integer }
        generated_at: { type: string, format: date-time }
